# UBAG small profile - coturn (compose profile "turn"). Static options only.
# Secret, realm, external-ip, allowed-peer-ip and the relay port range are
# supplied by docker-compose.small.yml from env (UBAG_VOICE_TURN_SECRET,
# UBAG_PUBLIC_DOMAIN, UBAG_VOICE_NAT_1TO1_IP / UBAG_TURN_EXTERNAL_IP,
# UBAG_TURN_RELAY_PORT_MIN/MAX) so no secret is stored in this file.

listening-port=3478

# Time-limited credentials: the gateway signs `<expiry>:<name>` with
# UBAG_VOICE_TURN_SECRET (the --static-auth-secret passed by compose).
use-auth-secret
fingerprint
no-cli
no-tls
no-dtls
no-multicast-peers
stale-nonce=600

# Bounded abuse surface.
user-quota=12
total-quota=100
log-file=stdout
simple-log

# Never relay into private / loopback / link-local / reserved space: otherwise a
# TURN client could reach the Docker networks or the host's LAN through this
# relay. compose adds `allowed-peer-ip=<UBAG_VOICE_NAT_1TO1_IP>` (allow beats
# deny), so the gateway's media address stays reachable even when it is a
# private LAN address; a public gateway address needs no exception.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
