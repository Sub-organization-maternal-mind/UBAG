[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubag-worker"
version = "2.1.0"
description = "UBAG Universal Browser Automation Worker"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "AGPL-3.0" }
dependencies = []

[project.scripts]
ubag-worker = "ubag_worker.cli:main"

[project.optional-dependencies]
antigravity-sdk = [
    "google-antigravity==0.1.17",
]
dev = [
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ubag_worker*"]
