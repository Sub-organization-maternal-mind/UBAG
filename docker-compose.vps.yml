# UBAG — VPS self-host profile (185.252.233.186, shared box).
#
# This is a trimmed sibling of docker-compose.small.yml, not an override of it:
# same Dockerfiles/config templates (deploy/small/*, unmodified), but only the
# services this box needs. Excluded vs the small profile: Dragonfly (confirmed
# unused by any gateway code path), MinIO (localfs artifacts instead — this host
# has persistent disk, unlike Render's free tier), and NATS (file-spool executor
# mode needs no queue at single-instance scale; verified in
# apps/gateway/internal/serve/serve.go + executor/{filespool,workerconsumer}.go:
# UBAG_EXECUTOR_MODE=file builds a FileSpoolWorkerQueue that never touches NATS).
#
# Live-browser (added 2026-07-17): a headed Google Chrome runs on the VPS (deploy/vps/
# browser) so provider logins live on the server and jobs run 24/7 with the
# operator's laptop off. The operator signs in once via the dashboard's Browser
# Sessions widget (streamed by tools/live-browser/bridge.mjs over /live-ws); the
# gateway's live worker attaches to that same Chrome over CDP. Safe-mode intact:
# a human does the login, UBAG never types credentials or solves CAPTCHAs.
#
# Current resource budget (cpus / mem_limit) on a shared 8-core / 24GB box
# (about 15 other stacks, load average ~10; capacity is identity-bound, not CPU-bound):
#   gateway......... 1.00 cpu / 1300m  (GOMAXPROCS=1, GOMEMLIMIT=950MiB; Go binary + Python live worker + Playwright CDP client)
#   nginx-dashboard.. 0.15 cpu /   96m
#   browser......... 2.00 cpu / 4096m  (headed Chrome + Xvfb; pids_limit 1024)
#   chat-reaper...... 0.10 cpu /  256m
#   TOTAL........... 3.25 cpu / 5748m (~5.6 GiB)
# Defaults asserted by tools/check-small-deployment.mjs: UBAG_WORKER_CONCURRENCY=1,
# UBAG_WORKER_DAEMON=false in source (production env sets true), UBAG_EXECUTOR_MODE=file,
# UBAG_GATEWAY_STORE=postgres.
#
# Postgres comes from the shared platform stack at /opt/platform since
# 2026-07-17 (one instance for every project on the box — see
# /opt/platform/PLATFORM-RULES.md). The gateway joins the external `platform`
# docker network and reads UBAG_POSTGRES_DSN from deploy/vps/env.local
# (credentials from /opt/platform/projects/ubag.env).
#
# Ingress: this box already runs a shared Nginx Proxy Manager (NPM) container
# for ~15 other client sites, listening on host 80/81/443. Rather than publish
# another host port (this VPS has no active firewall — ufw is inactive — so
# any 0.0.0.0-bound port is directly internet-reachable, not just via
# Cloudflare/NPM), nginx-dashboard joins NPM's own docker network
# (nginx-proxy-manager_default, declared external below) so NPM reaches it by
# container name with zero additional host-port exposure. See deploy/vps/README.md
# for the NPM Proxy Host settings and the ubag.polytronx.com DNS/Cloudflare status.
#
# Deploy: from /opt/docker/ubag on the VPS,
#   docker compose -f docker-compose.vps.yml --env-file deploy/vps/env.local up -d --build

name: ubag-vps

x-antigravity-account: &antigravity-account
  profiles: [antigravity-oauth]
  build:
    context: .
    dockerfile: deploy/vps/antigravity-account.Dockerfile
  image: ${UBAG_ANTIGRAVITY_ACCOUNT_IMAGE:-ubag/agy-account:vps-local}
  restart: unless-stopped
  mem_limit: 700m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [ubag-private]

services:
  # Applies migrations/postgres/0001-0010 itself via gateway-entrypoint.sh
  # (baked into the image), tolerating individual failures — 0008+ needs
  # pg_partman, not available on every managed Postgres and unused by the
  # mock/adapter-jobs scope this profile targets. No separate migrate step
  # needed.
  gateway:
    build:
      context: .
      dockerfile: deploy/small/gateway.Dockerfile
      args:
        UBAG_WITH_ANTIGRAVITY_SDK: ${UBAG_WITH_ANTIGRAVITY_SDK:-false}
        UBAG_ANTIGRAVITY_SLOT_1_ID: ${UBAG_ANTIGRAVITY_SLOT_1_ID:-acct_1}
        UBAG_ANTIGRAVITY_SLOT_2_ID: ${UBAG_ANTIGRAVITY_SLOT_2_ID:-acct_2}
        UBAG_ANTIGRAVITY_SLOT_3_ID: ${UBAG_ANTIGRAVITY_SLOT_3_ID:-acct_3}
    image: ${UBAG_GATEWAY_IMAGE:-ubag/gateway:vps-local}
    # One full core avoids throttling the embedded Python worker on a 6-vCPU VPS.
    cpus: "${UBAG_GATEWAY_CPUS:-1.00}"
    mem_limit: 1300m
    restart: unless-stopped
    environment:
      UBAG_GATEWAY_ADDR: ":8080"
      GOMAXPROCS: "1"
      GOMEMLIMIT: "950MiB"
      UBAG_APP_SECRET: ${UBAG_APP_SECRET:?Set UBAG_APP_SECRET in deploy/vps/env.local}
      UBAG_API_VERSION: ${UBAG_API_VERSION:-2026-05-22}
      UBAG_GATEWAY_VERSION: ${UBAG_GATEWAY_VERSION:-0.0.0-vps}
      UBAG_BUILD_COMMIT: ${UBAG_BUILD_COMMIT:-local}
      UBAG_ACTOR_ROLE: ${UBAG_ACTOR_ROLE:-}
      # PAT issuance (POST /v1/auth/pat) is opt-in server-side: the gateway
      # only reads these when present in the container environment, so they
      # must be listed here (env.local alone only feeds interpolation).
      UBAG_PAT_ENABLED: ${UBAG_PAT_ENABLED:-false}
      UBAG_PAT_DEFAULT_TTL_MS: ${UBAG_PAT_DEFAULT_TTL_MS:-}
      UBAG_GATEWAY_STORE: postgres
      UBAG_CONVERSATIONS_ENABLED: ${UBAG_CONVERSATIONS_ENABLED:-true}
      UBAG_FACADE_MAX_WAIT_MS: ${UBAG_FACADE_MAX_WAIT_MS:-240000}
      # Voice sessions (see /v1/voice/sessions + /v1/capabilities). The store
      # follows the gateway store kind by default (memory here unless
      # UBAG_GATEWAY_STORE says otherwise); the relay address is the browser
      # container's internal-only audio-relay port. Voice stays INERT until
      # UBAG_VOICE_AUDIO_ENABLED=1 also turns the browser's audio stack on.
      # The VPS default stays memory on purpose (P0.14: no live default change;
      # the gateway warns at startup on memory + SQL gateway). Containment:
      # UBAG_VOICE_STORE=disabled makes the voice routes return 501.
      UBAG_VOICE_STORE: ${UBAG_VOICE_STORE:-memory}
      # 1/true = stop media after 5 consecutive store errors (default off = fail open).
      UBAG_VOICE_RECONCILER_FAIL_CLOSED: ${UBAG_VOICE_RECONCILER_FAIL_CLOSED:-}
      # Voice and browser jobs exclude each other on a shared browser (P5.5). Empty/1 = on
      # (changes nothing while no voice session holds the browser); 0 = off.
      UBAG_VOICE_LANE_EXCLUSION: ${UBAG_VOICE_LANE_EXCLUSION:-}
      UBAG_VOICE_AUDIO_RELAY_ADDR: ${UBAG_VOICE_AUDIO_RELAY_ADDR:-browser:9099}
      # Control jobs carry the browser-context index on multi-context environments (empty/0 = off).
      UBAG_VOICE_CONTEXT_INDEX: ${UBAG_VOICE_CONTEXT_INDEX:-}
      # Per-environment relay port = registered CDP port + offset (empty/0 = fixed port).
      UBAG_VOICE_AUDIO_RELAY_PORT_OFFSET: ${UBAG_VOICE_AUDIO_RELAY_PORT_OFFSET:-}
      UBAG_VOICE_MAX_SESSIONS_PER_TENANT: ${UBAG_VOICE_MAX_SESSIONS_PER_TENANT:-4}
      UBAG_VOICE_MAX_QUEUED_PER_TENANT: ${UBAG_VOICE_MAX_QUEUED_PER_TENANT:-32}
      UBAG_VOICE_SESSION_TTL_SECONDS: ${UBAG_VOICE_SESSION_TTL_SECONDS:-600}
      # Shared secret authenticating media sessions to the browser audio relay
      # (the relay refuses all sessions when unset). Same value on both services.
      UBAG_VOICE_RELAY_SECRET: ${UBAG_VOICE_RELAY_SECRET:-}
      # Full DSN lives in deploy/vps/env.local (platform credentials from
      # /opt/platform/projects/ubag.env on the VPS — never committed).
      UBAG_POSTGRES_DSN: ${UBAG_POSTGRES_DSN:?Set UBAG_POSTGRES_DSN in deploy/vps/env.local}
      # Migrations are fail-closed; 0008_blueprint_schema.sql needs the
      # pgvector + pg_partman extensions so it stays opt-in. See
      # deploy/small/gateway-entrypoint.sh.
      UBAG_ALLOW_OPTIONAL_MIGRATIONS: ${UBAG_ALLOW_OPTIONAL_MIGRATIONS:-0}
      UBAG_IDEMPOTENCY_TTL_HOURS: ${UBAG_IDEMPOTENCY_TTL_HOURS:-24}
      UBAG_DATABASE_MAX_OPEN_CONNS: ${UBAG_DATABASE_MAX_OPEN_CONNS:-5}
      UBAG_DATABASE_MAX_IDLE_CONNS: ${UBAG_DATABASE_MAX_IDLE_CONNS:-2}
      UBAG_DATABASE_CONN_MAX_LIFETIME_SECONDS: ${UBAG_DATABASE_CONN_MAX_LIFETIME_SECONDS:-300}
      # No queue — jobs spool to disk and are picked up in-process by the worker.
      UBAG_EXECUTOR_MODE: file
      UBAG_EXECUTOR_SPOOL_DIR: /var/lib/ubag/executor-spool
      UBAG_ARTIFACT_STORE: localfs
      UBAG_ARTIFACT_DIR: /var/lib/ubag/artifacts
      UBAG_WORKER_CONSUMER_ENABLED: "true"
      # python:3.12-slim (this image's runtime base) installs its interpreter
      # under /usr/local/bin, not /usr/bin.
      UBAG_WORKER_PYTHON: /usr/local/bin/python3
      # run_live_worker.py routes live provider targets (chatgpt_web, gemini_web,
      # deepseek_web, ...) to the Playwright CDP-attach engine, and
      # target=mock still falls through to the registry mock adapter — so mock
      # jobs keep working unchanged (verified in run_live_worker.py routing).
      UBAG_WORKER_SCRIPT: /app/apps/worker/run_live_worker.py
      # Warm page reuse is opt-in. False preserves the per-job worker process;
      # when explicitly enabled, the daemon uses its bundled long-lived script.
      UBAG_WORKER_DAEMON: ${UBAG_WORKER_DAEMON:-false}
      UBAG_WORKER_DAEMON_SCRIPT: ${UBAG_WORKER_DAEMON_SCRIPT:-/app/apps/worker/run_worker_daemon.py}
      # Attach to the browser container's Chrome over CDP (via its socat proxy)
      # instead of launching a throwaway browser — live jobs reuse the operator's
      # manually-logged-in session. http(s):// endpoint => connect_over_cdp;
      # needs only the playwright pip package (already in the gateway image), no
      # browser download.
      # MUST be the browser's IP, not its service name: Chrome's DevTools HTTP
      # endpoint rejects any Host header that isn't localhost or an IP (a
      # hostname like "browser" gets HTTP 500), so this uses the static IP pinned
      # on ubag-private below. (The old production setup used an IP for the same
      # reason.)
      UBAG_REMOTE_BROWSER_ENDPOINT: ${UBAG_REMOTE_BROWSER_ENDPOINT:-http://172.28.0.10:9223}
      # Production benchmark (2026-08-10) selected 150 ms for the file-spool
      # hot path while retaining sub-1% idle gateway CPU.
      UBAG_WORKER_POLL_INTERVAL_MS: ${UBAG_WORKER_POLL_INTERVAL_MS:-150}
      UBAG_WORKER_CONCURRENCY: ${UBAG_WORKER_CONCURRENCY:-1}
      # Isolated warm-daemon slots (only with UBAG_WORKER_DAEMON=true). 1 is the
      # single daemon of today. The gateway caps the size at UBAG_WORKER_POOL_MAX
      # (default 3) until slot memory is measured against the 1300m cgroup, and
      # raises UBAG_WORKER_CONCURRENCY to the pool size. Empty = built-in default.
      UBAG_WORKER_POOL_SIZE: ${UBAG_WORKER_POOL_SIZE:-1}
      UBAG_WORKER_POOL_MAX: ${UBAG_WORKER_POOL_MAX:-}
      UBAG_WORKER_POOL_WAIT_MS: ${UBAG_WORKER_POOL_WAIT_MS:-}
      # Streaming ingest (all empty = off, today's batch path). With the first
      # flag the gateway applies a warm-daemon job's non-terminal events as they
      # arrive and holds the single terminal until the worker ends cleanly. It
      # only shows live tokens when the worker streams too (UBAG_WORKER_STREAM_EVENTS)
      # and it should be paired with UBAG_WORKER_STRICT_SUBMIT so a submitted
      # prompt is never replayed. Turn them on together, after a human has
      # verified the live DOM.
      UBAG_WORKER_STREAM_INGEST: ${UBAG_WORKER_STREAM_INGEST:-}
      UBAG_WORKER_STREAM_EVENTS: ${UBAG_WORKER_STREAM_EVENTS:-}
      UBAG_WORKER_STRICT_SUBMIT: ${UBAG_WORKER_STRICT_SUBMIT:-}
      # Stream batching (gateway; empty = defaults): coalescing window in ms
      # (0 = one write per event) and the per-attempt byte budget.
      UBAG_WORKER_STREAM_FLUSH_MS: ${UBAG_WORKER_STREAM_FLUSH_MS:-}
      UBAG_WORKER_STREAM_MAX_BYTES: ${UBAG_WORKER_STREAM_MAX_BYTES:-}
      # Live provider jobs (page loads, streamed responses) need more headroom
      # than mock jobs; matches the verified local live-runtime setting.
      # Covers auth readiness (57 s), manual login (300 s), three bounded
      # reasoning attempts (3 x 360 s), and cleanup without clipping a valid job.
      UBAG_WORKER_MAX_RUNTIME_MS: ${UBAG_WORKER_MAX_RUNTIME_MS:-1500000}
      UBAG_ANTIGRAVITY_ENABLED: ${UBAG_ANTIGRAVITY_ENABLED:-false}
      UBAG_ANTIGRAVITY_DATA_DIR: /var/lib/ubag/antigravity
      UBAG_ANTIGRAVITY_SOCKET_DIR: ${UBAG_ANTIGRAVITY_SOCKET_DIR:-}
      UBAG_ANTIGRAVITY_PROVIDER: ${UBAG_ANTIGRAVITY_PROVIDER:-sdk}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UBAG_ANTIGRAVITY_MODEL: ${UBAG_ANTIGRAVITY_MODEL:-gemini-3.8-flash}
      UBAG_ANTIGRAVITY_EFFORT: ${UBAG_ANTIGRAVITY_EFFORT:-high}
      UBAG_ANTIGRAVITY_MAX_CONCURRENT: ${UBAG_ANTIGRAVITY_MAX_CONCURRENT:-2}
      UBAG_ANTIGRAVITY_MAX_MODEL_CALLS: ${UBAG_ANTIGRAVITY_MAX_MODEL_CALLS:-20}
      UBAG_ANTIGRAVITY_MAX_TOOL_CALLS: ${UBAG_ANTIGRAVITY_MAX_TOOL_CALLS:-50}
      UBAG_ANTIGRAVITY_COMPACTION: ${UBAG_ANTIGRAVITY_COMPACTION:-true}
      UBAG_ANTIGRAVITY_TOOL_OUTPUT_MAX_CHARS: ${UBAG_ANTIGRAVITY_TOOL_OUTPUT_MAX_CHARS:-10000}
      UBAG_ANTIGRAVITY_RETRY_MAX: ${UBAG_ANTIGRAVITY_RETRY_MAX:-3}
      AGY_BINARY: ${AGY_BINARY:-agy}
      UBAG_WEBHOOK_OUTBOX: postgres
      UBAG_WEBHOOK_WORKER_ENABLED: ${UBAG_WEBHOOK_WORKER_ENABLED:-true}
      UBAG_WEBHOOK_ALLOWED_HOSTS: ${UBAG_WEBHOOK_ALLOWED_HOSTS:-}
      UBAG_WEBHOOK_SECRET: ${UBAG_WEBHOOK_SECRET:-}
      # Record every chat a live job creates, so the chat-reaper below can only
      # ever delete OUR chats and never the operator's own. The accounts are real
      # and their sidebars mix UBAG's job chats with the human's work; provider
      # deletion is permanent. Recording is the safety mechanism — without it the
      # reaper has no legitimate targets at all (which is the safe failure mode).
      UBAG_CHAT_LEDGER_ENABLED: ${UBAG_CHAT_LEDGER_ENABLED:-true}
      UBAG_CHAT_LEDGER_PATH: /var/lib/ubag/chat-ledger/ledger.jsonl
    volumes:
      - executor_spool:/var/lib/ubag/executor-spool
      - artifact_data:/var/lib/ubag/artifacts
      - chat_ledger:/var/lib/ubag/chat-ledger
      - antigravity_accounts:/var/lib/ubag/antigravity
      - antigravity_ipc_slot_1:/run/ubag-antigravity/${UBAG_ANTIGRAVITY_SLOT_1_ID:-acct_1}
      - antigravity_ipc_slot_2:/run/ubag-antigravity/${UBAG_ANTIGRAVITY_SLOT_2_ID:-acct_2}
      - antigravity_ipc_slot_3:/run/ubag-antigravity/${UBAG_ANTIGRAVITY_SLOT_3_ID:-acct_3}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ubag-private
      # Shared backing-services network (platform-postgres et al.) — created by
      # /opt/platform/bin/init-platform.sh.
      - platform
      # OET application stack network (oet-api/oet-ai-worker live here). Lets
      # the OET backend reach the gateway privately as
      # http://ubag-vps-gateway-1:8080 with no public HTTP hop. Added for the
      # UBAG-as-OET-AI-provider integration (OpenAI facade); harmless to other
      # tenants — the gateway still authenticates every caller.
      - oetwebsite_internal

  agy-slot-1:
    <<: *antigravity-account
    environment:
      UBAG_ANTIGRAVITY_ACCOUNT_ID: ${UBAG_ANTIGRAVITY_SLOT_1_ID:-acct_1}
    volumes:
      - antigravity_ipc_slot_1:/run/ubag-antigravity
      - antigravity_slot_1:/var/lib/agy

  agy-slot-2:
    <<: *antigravity-account
    environment:
      UBAG_ANTIGRAVITY_ACCOUNT_ID: ${UBAG_ANTIGRAVITY_SLOT_2_ID:-acct_2}
    volumes:
      - antigravity_ipc_slot_2:/run/ubag-antigravity
      - antigravity_slot_2:/var/lib/agy

  agy-slot-3:
    <<: *antigravity-account
    environment:
      UBAG_ANTIGRAVITY_ACCOUNT_ID: ${UBAG_ANTIGRAVITY_SLOT_3_ID:-acct_3}
    volumes:
      - antigravity_ipc_slot_3:/run/ubag-antigravity
      - antigravity_slot_3:/var/lib/agy

  nginx-dashboard:
    image: nginx:alpine
    container_name: ubag-nginx-dashboard
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    cpus: "0.15"
    mem_limit: 96m
    environment:
      UBAG_GATEWAY_SECRET: ${UBAG_APP_SECRET:?Set UBAG_APP_SECRET in deploy/vps/env.local}
      NGINX_ENVSUBST_FILTER: "UBAG_"
    volumes:
      - "./deploy/small/nginx-dashboard/default.conf.template:/etc/nginx/templates/default.conf.template:ro"
      - "./deploy/vps/nginx-dashboard/.htpasswd:/etc/nginx/.htpasswd:ro"
      - "./apps/dashboard/dist:/srv/dashboard:ro"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ubag-private
      # NPM's own network — lets the shared Nginx Proxy Manager container
      # reach this one by name (ubag-nginx-dashboard:80) without publishing
      # any host port. Must already exist (created by the nginx-proxy-manager
      # compose stack at /opt/docker/nginx-proxy-manager).
      - nginx-proxy-manager_default

  # Headed Google Chrome on Xvfb, streamed to the dashboard's Browser Sessions
  # widget by tools/live-browser/bridge.mjs (attach-only). The operator logs in
  # to providers here; the gateway's live worker attaches over CDP (socat proxy
  # on 9223). Profile persists on a named volume so logins survive restarts.
  # No host port published — nginx reaches the bridge (58090) over ubag-private,
  # and CDP (9223) never leaves the internal network.
  browser:
    build:
      context: .
      dockerfile: deploy/vps/browser/Dockerfile
    image: ${UBAG_BROWSER_IMAGE:-ubag/vps-browser:local}
    container_name: ubag-vps-browser
    restart: unless-stopped
    # Raised 2026-09-27 after the wedged-Chrome incident: 1.0 CPU / 1900MB
    # starved Chrome under the worker + screencast load (watchdog pkill loop,
    # instant worker-attach failures, dead screencast). 2.0 CPU / 4GB per
    # owner directive; the box has 6 cores / 11GB.
    cpus: "2.0"
    mem_limit: 4096m
    # Chrome uses multiple threads per provider renderer. The inherited 256
    # task cap caused new_page crashes before any worker event could be emitted.
    pids_limit: 1024
    environment:
      UBAG_BROWSER_GEOMETRY: ${UBAG_BROWSER_GEOMETRY:-1280x800x24}
      # about:blank keeps the operator's idle tab at ~30MB instead of a parked
      # chatgpt.com renderer (~250MB); the dashboard's URL box navigates it when
      # a login is needed. Override to a provider URL to restore the old default.
      UBAG_BROWSER_START_URL: ${UBAG_BROWSER_START_URL:-about:blank}
      # Voice media plane (opt-in via env.local): starts PulseAudio with the
      # virtual mic + provider sink and the audio relay the gateway's MediaHub
      # dials. Off by default — the production browser only gains audio when
      # the operator sets UBAG_VOICE_AUDIO_ENABLED=1.
      UBAG_VOICE_AUDIO_ENABLED: ${UBAG_VOICE_AUDIO_ENABLED:-0}
      # Empty = the entrypoint's 0.0.0.0:9099 (or CDP proxy port + offset when
      # UBAG_VOICE_RELAY_PORT_OFFSET is set). UBAG_VOICE_ENV_ID namespaces the
      # Pulse devices and mic FIFO per environment (empty = historic names).
      UBAG_VOICE_RELAY_ADDR: ${UBAG_VOICE_RELAY_ADDR:-}
      UBAG_VOICE_RELAY_PORT_OFFSET: ${UBAG_VOICE_RELAY_PORT_OFFSET:-}
      UBAG_VOICE_ENV_ID: ${UBAG_VOICE_ENV_ID:-}
      UBAG_VOICE_RELAY_SECRET: ${UBAG_VOICE_RELAY_SECRET:-}
      # Opt-in relay measurement: a JSON stats line every 10 s in /run/ubag/audio-relay.log.
      UBAG_VOICE_RELAY_STATS: ${UBAG_VOICE_RELAY_STATS:-0}
    volumes:
      - browser_profile:/profiles
    healthcheck:
      # Healthy only when BOTH the dashboard bridge (58090) and Chrome's CDP
      # (58091) answer — a wedged Chrome behind a live bridge still flips this.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:58090/health >/dev/null 2>&1 && wget -qO- http://127.0.0.1:58091/json/version >/dev/null 2>&1 && wget -qO- http://127.0.0.1:6080/vnc.html >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      ubag-private:
        # Static IP so the gateway's CDP endpoint (an IP, not a hostname — see
        # UBAG_REMOTE_BROWSER_ENDPOINT above) is stable across recreation.
        ipv4_address: 172.28.0.10
        aliases: [browser-viewer]

  # Deletes UBAG's own stale job chats so the operator's sidebar stays clean.
  # It reads ONLY the chat ledger (chats UBAG recorded itself as creating) — it
  # never scans the sidebar, matches titles, or reasons about age alone, so the
  # operator's own chats are unreachable from here by construction. Bound
  # conversations are skipped (deleting one breaks the next turn). Deletion is
  # PERMANENT on these providers, hence: dry-run unless explicitly enabled.
  chat-reaper:
    image: ${UBAG_GATEWAY_IMAGE:-ubag/gateway:vps-local}
    container_name: ubag-vps-chat-reaper
    restart: unless-stopped
    cpus: "0.10"
    mem_limit: 256m
    depends_on:
      browser:
        condition: service_healthy
    environment:
      # Inert by default (repo convention for risky runtime features): without
      # this the loop only reports what it WOULD delete.
      UBAG_CHAT_REAPER_ENABLED: ${UBAG_CHAT_REAPER_ENABLED:-false}
      UBAG_CHAT_TTL_SECONDS: ${UBAG_CHAT_TTL_SECONDS:-7200}
      UBAG_CHAT_LEDGER_PATH: /var/lib/ubag/chat-ledger/ledger.jsonl
      UBAG_REMOTE_BROWSER_ENDPOINT: ${UBAG_REMOTE_BROWSER_ENDPOINT:-http://172.28.0.10:9223}
      UBAG_CHAT_REAPER_INTERVAL_SECONDS: ${UBAG_CHAT_REAPER_INTERVAL_SECONDS:-900}
    volumes:
      - chat_ledger:/var/lib/ubag/chat-ledger
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do python3 /app/apps/worker/run_chat_reaper.py || echo "chat-reaper: cycle failed"; sleep "${UBAG_CHAT_REAPER_INTERVAL_SECONDS:-900}"; done'
    networks:
      - ubag-private

networks:
  ubag-private:
    # NOT internal: the browser container needs outbound internet to reach the
    # AI providers (chatgpt.com, gemini, etc.) — an internal network gave Chrome
    # ERR_NAME_NOT_RESOLVED. This carries only app-tier traffic (gateway ↔ browser
    # ↔ nginx); Postgres is on the external `platform` network, and none of these
    # containers publish a host port, so dropping `internal` grants egress only —
    # it adds no inbound exposure. The gateway also reaches egress via `platform`.
    # Pinned subnet so the browser container can hold a static IP (172.28.0.10)
    # for the gateway's CDP endpoint. 172.28.0.0/24 was free on this box at
