syntax = "proto3";

// ubag.helper.v1: the primary-to-Helper-Node execution contract (ADR-0006,
// ADR-0007). It is a separate package from the public ubag.v1 so its breaking
// change policy is independent.
//
// Direction (decision D3): the primary is the gRPC CLIENT and dials the helper
// over WireGuard; the helper is the gRPC SERVER behind mTLS. The manager CA
// issues certs of at most 72h, the primary pins the SPKI, and the helper's node
// identity is the URI SAN of its cert. Any node_id carried in a message is a
// cross-check only; the certificate is authoritative.
//
// Safe Mode (ADR-0002) applies to every message: nothing here carries
// credentials, cookies or session material, and provider logins stay
// out-of-band human logins on the helper.
//
// Vocabulary: "Helper Node", never a bare "fleet node". The Attempt Lease
// (120 s TTL, 20 s renewal, generation fencing) is distinct from the gateway
// Exec Lease (90 s TTL, 10 s heartbeat, no generation).
//
// Voice RPCs live in helper_voice.proto (HelperVoiceService, same package,
// P5.7); HelperService deliberately carries none.
package ubag.helper.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ubag/ubag/packages/proto/gen/go/ubag/helper/v1;helperv1";

// HelperService is served by a Helper Node. gRPC status mapping for fenced RPCs:
//   ABORTED             stale lease_generation or attempt_id mismatch (stale writer)
//   FAILED_PRECONDITION input_fingerprint or workload_version mismatch
//   PERMISSION_DENIED   node_id does not match the certificate identity
//   NOT_FOUND           unknown attempt (InspectAttempt reports UNKNOWN instead)
//   UNAVAILABLE         helper draining or over capacity (caller retries elsewhere)
service HelperService {
  // Handshake negotiates protocol and workload versions before any attempt.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  // ReportCapacity is polled by the primary every 15 s and doubles as the
  // heartbeat. Effective cap = min(manager grant, UBAG ceiling table); the
  // helper only reports what it observes and enforces locally.
  rpc ReportCapacity(ReportCapacityRequest) returns (ReportCapacityResponse);

  // RunAttempt starts one attempt and streams its events until a terminal
  // event. PROMPT_SUBMITTED is the submission boundary: once the primary has
  // seen it, a failure is post-submit and must never be blindly resubmitted
  // (it ends `failed` with submitted=true and reconcile_required, per D4).
  //
  // The attempt's life is tied to its lease, not to this stream: a broken stream
  // does not stop the attempt. Calling RunAttempt again with the same attempt_id,
  // lease_generation and input_fingerprint re-attaches: the helper replays the
  // attempt's events from sequence 1 (the primary dedupes by event key), then
  // continues live, and reads the fence's lease_expires_at like RenewAttempt. It
  // never starts a second run. An attempt whose lease is not renewed is killed
  // by the helper itself and ends `failed` (stream_end_reason "lease_expired").
  rpc RunAttempt(RunAttemptRequest) returns (stream RunAttemptResponse);

  // RenewAttempt extends the Attempt Lease (primary renews every 20 s).
  rpc RenewAttempt(RenewAttemptRequest) returns (RenewAttemptResponse);

  // CancelAttempt asks the helper to stop an attempt.
  rpc CancelAttempt(CancelAttemptRequest) returns (CancelAttemptResponse);

  // InspectAttempt is read-only and reports what the helper knows about an
  // attempt, including after a stream break. It is the reconcile primitive.
  rpc InspectAttempt(InspectAttemptRequest) returns (InspectAttemptResponse);

  // Drain stops new attempts on the node; running attempts finish or are
  // cancelled after the grace period. Node-scoped: it carries no Fence.
  rpc Drain(DrainRequest) returns (DrainResponse);

  // StageManifest declares the content-addressed inputs an attempt needs. Bytes
  // never travel over gRPC: the response names the helper's staging HTTPS path
  // prefix (served on the same mTLS listener, NOT under /v1), and the primary
  // uploads each missing sha256 there.
  rpc StageManifest(StageManifestRequest) returns (StageManifestResponse);
}

// Fence identifies one leased attempt and rides on every mutating RPC. A
// helper rejects any call whose lease_generation is older than the one it
// holds. Event key = attempt_id:sequence (sequence is per attempt, from 1).
message Fence {
  string job_id = 1;
  // Format ^att_[A-Za-z0-9]+$ (see worker-daemon schemas).
  string attempt_id = 2;
  string node_id = 3;
  // Monotonically increasing per job; fences stale writers.
  uint64 lease_generation = 4;
  google.protobuf.Timestamp lease_expires_at = 5;
  // Hash of the attempt input so a retried attempt cannot change it silently.
  string input_fingerprint = 6;
  string workload_version = 7;
}

message HandshakeRequest {
  // Always "ubag.helper.v1".
  string protocol_version = 1;
  string primary_workload_version = 2;
  // Cross-check against the certificate URI SAN; may be empty.
  string node_id = 3;
}

message HandshakeResponse {
  string protocol_version = 1;
  string helper_version = 2;
  string workload_version = 3;
  // Cross-check only; the certificate URI SAN is authoritative.
  string node_id = 4;
  // Optional capabilities, e.g. "streaming_events". Unknown values are ignored.
  repeated string features = 5;
  google.protobuf.Timestamp server_time = 6;
  // Canonical SHA-256 (lowercase hex) of the adapter registry and the manifests
  // it lists, as loaded on this node. The primary compares it with its own
  // digest; a mismatch (or an empty value) makes the node ineligible.
  string registry_digest = 7;
}

message ReportCapacityRequest {
  // Cross-check against the certificate URI SAN; may be empty.
  string node_id = 1;
}

enum IdentitySlotState {
  IDENTITY_SLOT_STATE_UNSPECIFIED = 0;
  IDENTITY_SLOT_STATE_IDLE = 1;
  IDENTITY_SLOT_STATE_BUSY = 2;
  IDENTITY_SLOT_STATE_MANUAL_ACTION_REQUIRED = 3;
  IDENTITY_SLOT_STATE_UNAVAILABLE = 4;
}

// One physical provider session. One active operation per slot (decision D6).
// identity_ref is an opaque reference, never a credential.
message IdentitySlot {
  string provider = 1;
  string identity_ref = 2;
  IdentitySlotState state = 3;
  string active_attempt_id = 4;
}

message ReportCapacityResponse {
  string node_id = 1;
  google.protobuf.Timestamp observed_at = 2;
  int32 cpu_millis_total = 3;
  int32 cpu_millis_used = 4;
  int64 memory_bytes_total = 5;
  int64 memory_bytes_used = 6;
  int32 browsers_max = 7;
  int32 browsers_active = 8;
  int32 attempts_active = 9;
  bool draining = 10;
  string workload_version = 11;
  repeated IdentitySlot slots = 12;
  // Same value as HandshakeResponse.registry_digest, repeated on every heartbeat
  // so a registry change on a running node is noticed without a new handshake.
  string registry_digest = 13;
}

// Asset is a content-addressed input. sha256 is lowercase hex.
message Asset {
  string sha256 = 1;
  int64 size_bytes = 2;
  string media_type = 3;
  string name = 4;
}

message RunAttemptRequest {
  Fence fence = 1;
  string provider = 2;
  string target = 3;
  string command_type = 4;
  // Opaque slot reference chosen by the primary; never a credential.
  string identity_ref = 5;
  string input_json = 6;
  string options_json = 7;
  repeated Asset assets = 8;
  string trace_id = 9;
  // Wall-clock budget for the attempt; expiry ends it `timed_out` (D4).
  int32 deadline_seconds = 10;
}

enum AttemptEventType {
  ATTEMPT_EVENT_TYPE_UNSPECIFIED = 0;
  ATTEMPT_EVENT_TYPE_STARTED = 1;
  ATTEMPT_EVENT_TYPE_BROWSER_OPENED = 2;
  ATTEMPT_EVENT_TYPE_MANUAL_ACTION_REQUIRED = 3;
  // Submission boundary: the prompt has been sent to the provider.
  ATTEMPT_EVENT_TYPE_PROMPT_SUBMITTED = 4;
  // Provisional output; only a terminal outcome yields the result.
  ATTEMPT_EVENT_TYPE_TOKEN = 5;
  ATTEMPT_EVENT_TYPE_ARTIFACT_CREATED = 6;
  ATTEMPT_EVENT_TYPE_WARNING = 7;
  // Terminal: exactly one event carries `outcome`.
  ATTEMPT_EVENT_TYPE_TERMINAL = 8;
}

enum AttemptStatus {
  ATTEMPT_STATUS_UNSPECIFIED = 0;
  ATTEMPT_STATUS_COMPLETED = 1;
  ATTEMPT_STATUS_FAILED = 2;
  ATTEMPT_STATUS_TIMED_OUT = 3;
  ATTEMPT_STATUS_CANCELLED = 4;
}

// AttemptOutcome mirrors the D4 job-event semantics. A deadline cut is
// TIMED_OUT with partial=true and no partial text in result_json. Post-submit
// ambiguity is FAILED with submitted=true and reconcile_required=true.
message AttemptOutcome {
  AttemptStatus status = 1;
  bool submitted = 2;
  bool reconcile_required = 3;
  bool partial = 4;
  // e.g. "deadline", "provider_closed", "drift", "manual_action", "captcha".
  string stream_end_reason = 5;
  string error_code = 6;
  // Sanitized and bounded; never internal error text.
  string error_message = 7;
  string result_json = 8;
}

// AttemptEvent: key is attempt_id:sequence; data_json mirrors job-event data.
message AttemptEvent {
  string attempt_id = 1;
  uint64 sequence = 2;
  uint64 lease_generation = 3;
  AttemptEventType type = 4;
  google.protobuf.Timestamp created_at = 5;
  string data_json = 6;
  AttemptOutcome outcome = 7;
}

message RunAttemptResponse {
  AttemptEvent event = 1;
}

enum AttemptState {
  ATTEMPT_STATE_UNSPECIFIED = 0;
  // Helper has no record (e.g. restarted); the primary must reconcile.
  ATTEMPT_STATE_UNKNOWN = 1;
  ATTEMPT_STATE_ACCEPTED = 2;
  ATTEMPT_STATE_RUNNING = 3;
  ATTEMPT_STATE_SUBMITTED = 4;
  ATTEMPT_STATE_FINISHED = 5;
}

message RenewAttemptRequest {
  Fence fence = 1;
}

message RenewAttemptResponse {
  uint64 lease_generation = 1;
  google.protobuf.Timestamp lease_expires_at = 2;
  AttemptState state = 3;
}

message CancelAttemptRequest {
  Fence fence = 1;
  string reason = 2;
}

message CancelAttemptResponse {
  AttemptState state = 1;
  bool submitted = 2;
}

message InspectAttemptRequest {
  string job_id = 1;
  string attempt_id = 2;
}

message InspectAttemptResponse {
  AttemptState state = 1;
  uint64 lease_generation = 2;
  google.protobuf.Timestamp lease_expires_at = 3;
  string input_fingerprint = 4;
  uint64 last_sequence = 5;
  bool submitted = 6;
  // Set only when state is FINISHED.
  AttemptOutcome outcome = 7;
}

message DrainRequest {
  // Cross-check against the certificate URI SAN; may be empty.
  string node_id = 1;
  int32 grace_seconds = 2;
  string reason = 3;
}

message DrainResponse {
  bool draining = 1;
  int32 attempts_active = 2;
}

message StageManifestRequest {
  Fence fence = 1;
  repeated Asset assets = 2;
}

message StageManifestResponse {
  // sha256 values the helper does not hold yet.
  repeated string missing_sha256 = 1;
  // Path prefix on the helper's mTLS HTTPS listener, e.g. "/staging". Never
  // under /v1; the upload URL is <prefix>/<sha256>.
  string staging_path_prefix = 2;
  google.protobuf.Timestamp upload_expires_at = 3;
}
