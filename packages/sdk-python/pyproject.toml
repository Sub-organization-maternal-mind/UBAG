[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ubag-client"
version = "0.0.0"
description = "Stdlib-only Python client for the UBAG gateway: capabilities, multimodal chat and voice sessions."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["ubag_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
