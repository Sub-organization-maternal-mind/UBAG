            required: [tenant_id, app_id, target, conversation_key, state, created_at, last_used_at]
            properties:
              tenant_id:
                type: string
              app_id:
                type: string
              target:
                type: string
              conversation_key:
                type: string
              provider_thread_ref:
                type: string
                description: Provider chat URL. Never contains session or credential material.
              state:
                type: string
