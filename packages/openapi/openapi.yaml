            default: 1
        - name: count
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: filter
          in: query
          required: false
          description: SCIM filter expression; only a single eq comparison is implemented.
          schema:
            type: string
      responses:
        "200":
          description: SCIM list response.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/SCIMListResponse"
