openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: UBAG REST API
  version: 0.1.0
  summary: Initial UBAG v1 REST contract.
  description: |
    Contract-first REST surface for UBAG v0/v1 workers. This file defines
    route stability, request and response envelopes, stable errors, and job
    event retrieval for the gateway, SDK, worker, CLI, and dashboard surfaces.
  license:
    name: Apache-2.0 for public contract artifacts
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.ubag.dev
    description: Public production API placeholder.
tags:
  - name: System
    description: Operational health, readiness, and version endpoints.
  - name: Jobs
    description: Job creation, retrieval, listing, and lifecycle events.
  - name: Events
    description: Cross-job event history and streaming entry points.
  - name: Workflows
    description: Workflow definitions and execution templates.
  - name: Templates
    description: Prompt, extraction, and normalization templates.
  - name: Targets
    description: Registered target adapters and browser automation destinations.
  - name: Apps
    description: Client applications allowed to submit work.
  - name: Devices
    description: Device enrollment and token surfaces.
  - name: Webhooks
    description: Signed callback destinations.
  - name: Cache
    description: Semantic and artifact cache visibility.
  - name: Audit
    description: Immutable operator and automation audit entries.
  - name: Observability
    description: Metrics and runtime telemetry.
  - name: Browser Topology
    description: Read-only multi-tab browser topology and adaptive concurrency observability.
  - name: Alerts
    description: Human-in-the-loop manual-action alerts and notification configuration.
  - name: OpenAICompat
    description: Drop-in OpenAI-compatible chat completions backed by UBAG jobs.
  - name: SSO
    description: Enterprise single sign-on (OIDC/SAML) configuration, callbacks, and session logout.
  - name: Antigravity
    description: Human-operated OAuth CLI sessions in isolated account workers.
  - name: Auth
    description: Personal access token (PAT) issuance and revocation.
  - name: MFA
    description: TOTP multi-factor enrollment and session verification.
  - name: Admin
    description: Region kill-switch control and just-in-time elevation grants.
  - name: Privacy
    description: Subject data export and erasure (GDPR Art. 15/17) requests.
  - name: SIEM
    description: SIEM sink configuration for audit export forwarding.
  - name: SCIM
    description: RFC 7644 user and group provisioning.
  - name: Rate Limits
    description: Configured per-action rate-limit policies.
security:
  - bearerAuth: []
paths:
  /v1/capabilities:
    get:
      tags: [Capabilities]
      operationId: listCapabilities
      summary: Discover per-target media and voice support.
      description: >-
        Publishes, per target, the attachment policy (same shape as
        /v1/adapters), the OpenAI-facade inline message-part formats
        intersected with that policy, live-voice support (from each adapter
        manifest's voice block), and the number of available voice accounts
        (topology contexts whose last worker-detected login state is
        authenticated). Advertisement is not a login guarantee:
        manual_login_required stays authoritative. Each record's voice object
        publishes supported (adapter declares live voice), configured (this
        gateway has the voice store, media plane and provider activation
        wired), verified (true only when a live acceptance run is recorded;
        verified_note carries the text), available (configured and a free
        authenticated account+environment exists now) and free_resources
        separately; live (= supported) and available_accounts
        (= free_resources) are legacy aliases. Requires the job:read action.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      responses:
        "200":
          description: Capability records returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/voice/sessions:
    get:
      tags: [Voice]
      operationId: listVoiceSessions
      summary: List this tenant's voice sessions.
      description: >-
        Returns voice sessions scoped to the authenticated tenant, newest
        first. Requires the job:read action. 501 when voice sessions are
        not configured on this gateway (UBAG_VOICE_STORE disabled).
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/Limit"
        - name: target
          in: query
          required: false
          description: Filter by live target key.
          schema:
            type: string
      responses:
        "200":
          description: Voice sessions returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Voice]
      operationId: createVoiceSession
      summary: Create (reserve) a voice session.
      description: >-
        Reserves a voice session for a live-voice target. Each active session
        holds an EXCLUSIVE provider-account lease and an EXCLUSIVE
        browser/audio-environment lease (shared, atomic reservations - one
        live session per tenant+target+identity and per tenant browser
        instance). When no account+environment combination is free the
        session is created QUEUED (202) with no leases held; promote it via
        the connect action. Requires the job:create action; tenant and app
        scope come from the authenticated principal. Budgets: active
        sessions and the queued backlog are capped per tenant with explicit
        429 overload responses carrying retry guidance.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceSessionCreateRequest"
      responses:
        "201":
          description: Session created with leases claimed (connecting).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSessionResponse"
        "202":
          description: Session created QUEUED (no leases held).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Voice-session budget reached (UBAG-VOICE-SESSION-LIMIT-003 or UBAG-VOICE-QUEUE-FULL-004). Carries a Retry-After header and retry_after_ms.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/voice/sessions/{session_id}:
    get:
      tags: [Voice]
      operationId: getVoiceSession
      summary: Read one voice session's status.
      description: >-
        Tenant-scoped: a session from another tenant is indistinguishable
        from a nonexistent one (404). Requires the job:read action.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Voice session returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags: [Voice]
      operationId: terminateVoiceSession
      summary: Terminate a voice session and release its leases.
      description: >-
        Idempotent termination: releases the provider-account and
        browser-environment leases immediately and drops the media path (no
        wait for ICE). Requires the job:create action.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session terminated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/voice/sessions/{session_id}/connect:
    post:
      tags: [Voice]
      operationId: connectVoiceSession
      summary: Negotiate the WebRTC media connection.
      description: >-
        Claims leases first when the session is queued (409 with retry
        guidance when nothing is free), hands the SDP offer to the gateway's
        media plane, and returns the answer with every ICE candidate
        embedded (HTTP-only signaling), the ICE servers to configure, and a
        short-lived media credential scoped to tenant+app+session. The
        client must send it as the first message on the "control" data
        channel ({"op":"auth","credential":...}); control commands are
        ignored until authenticated. Requires the job:create action. Every
        action under /v1/voice/sessions/{session_id}/ (connect, mute, renew,
        terminate) is POST-only (405 with Allow otherwise); oversized bodies
        answer 413; a browser request with a disallowed Origin answers 403
        UBAG-AUTHZ-ORIGIN-005 (server-to-server calls send no Origin). Every
        429/503 carries a Retry-After header and retry_after_ms.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceSessionConnectRequest"
      responses:
        "200":
          description: Answer and media credential returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSessionConnectResponse"
        "409":
          description: Session cannot connect (state or no free leases).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          description: Media plane cannot accept the connection (UBAG-VOICE-MEDIA-UNAVAILABLE-007).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/voice/sessions/{session_id}/mute:
    post:
      tags: [Voice]
      operationId: muteVoiceSession
      summary: Mute or unmute the session's microphone.
      description: >-
        Control channel for the session's mic direction; the provider still
        speaks while muted. Requires the job:create action.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [muted]
              properties:
                muted:
                  type: boolean
      responses:
        "200":
          description: Mute state applied.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/voice/sessions/{session_id}/renew:
    post:
      tags: [Voice]
      operationId: renewVoiceSessionLease
      summary: Renew the session lease (client heartbeat).
      description: >-
        Extends the lease window so the sweeper does not reap a live
        session. A client that stops heart-beating without terminating
        cannot pin a provider account longer than the TTL. An expired or
        terminated session cannot be renewed (409). Requires the job:create
        action.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lease renewed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/voice/sessions/{session_id}/terminate:
    post:
      tags: [Voice]
      operationId: terminateVoiceSessionPost
      summary: Terminate a voice session (POST form of DELETE).
      description: >-
        Idempotent termination identical to DELETE the session for clients
        that cannot issue DELETE. Requires the job:create action.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session terminated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Get shallow service health.
      description: Returns process-level health without checking downstream dependencies.
      security: []
      responses:
        "200":
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Get dependency readiness.
      description: Returns readiness for accepting job traffic, including required dependencies.
      security: []
      responses:
        "200":
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Service is alive but not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Get gateway version information.
      security: []
      responses:
        "200":
          description: Version metadata for the running gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionStatus"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/metrics:
    get:
      tags: [Observability]
      operationId: getMetrics
      summary: Get Prometheus gateway metrics.
      description: Includes gateway HTTP, readiness, job, SSE, queue dispatch, and worker execution metric families without per-job labels.
      security: []
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List cross-job events.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Event records returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/stream:
    get:
      tags: [Events]
      operationId: streamEventsWebSocket
      summary: Open the WebSocket event stream.
      responses:
        "101":
          description: WebSocket upgrade accepted.
        "426":
          description: Request must use a WebSocket upgrade.
          headers:
            Upgrade:
              description: Required protocol.
              schema:
                type: string
                const: websocket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/workflows:
    get:
      tags: [Workflows]
      operationId: listWorkflows
      summary: List workflow definitions.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Workflow records returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Workflows]
      operationId: createWorkflow
      summary: Create a workflow definition.
      description: |-
        Creates a multi-step workflow definition. Steps run in topological
        order: a step lists the step IDs it depends on in `depends_on`; steps
        with an empty list follow the previous step (linear chain). Cyclic or
        dangling dependencies are rejected with UBAG-VALIDATION-WORKFLOW-DEPENDENCY-001.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowCreateRequest"
      responses:
        "201":
          description: Workflow definition created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: Idempotency key conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: List templates.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Template records returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/targets:
    get:
      tags: [Targets]
      operationId: listTargets
      summary: List configured targets.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Target records returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/adapters:
    get:
      tags: [Targets]
      operationId: listAdapters
      summary: List adapter manifests.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Adapter records returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/apps:
    get:
      tags: [Apps]
      operationId: listApps
      summary: List client applications.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: App records returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List enrolled devices.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Device records returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhook destinations.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Webhook records returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/webhooks/replay:
    post:
      tags: [Webhooks]
      operationId: replayWebhookDelivery
      summary: Replay a webhook delivery.
      description: Idempotently requests replay of a prior webhook delivery and records an audit event.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookReplayRequest"
      responses:
        "202":
          description: Webhook replay accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReplayResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency key conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/cache:
    get:
      tags: [Cache]
      operationId: getCacheStatus
      summary: Get cache status and visible entries.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      responses:
        "200":
          description: Cache status returned.
          content:
            application/json:
              schema:
