        conversation_id:
          type: string
        current_job_id:
          type: string
        jobs_completed:
          type: integer
          minimum: 0
        rss_bytes:
          type: integer
          minimum: 0
        last_health_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        recycle_at:
          type: string
          format: date-time
    ConcurrencyView:
      type: object
      additionalProperties: false
      required: [target, identity_ref, current_cap, min, max, in_flight, last_change_at]
      properties:
        target:
