  /v1/auth/pat:
    post:
      tags: [Auth]
      operationId: issuePAT
      summary: Issue a personal access token.
      description: |-
        Mints a PAT that inherits the caller's tenant/app scope unless a
        superadmin overrides tenant_id/app_id/role in the body. An explicit
        ttl_seconds is capped at one year (31536000); a negative ttl_seconds
        (never-expiring) requires superadmin. Requires the auth:pat:issue
        action (MFA-gated when MFA is enabled). Answers 501 when PAT issuance
        is not enabled.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PATIssueRequest"
      responses:
        "201":
          description: PAT issued. The token value is shown once at issuance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PATIssueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: Body exceeds the gateway request body limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/auth/pat/{id}/revoke:
    post:
      tags: [Auth]
      operationId: revokePAT
      summary: Revoke a personal access token.
      description: |-
        Retires an issued PAT. Unknown IDs and tokens belonging to another
        tenant are indistinguishable 404s. Requires the auth:pat:issue action
        (MFA-gated when MFA is enabled).
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: PAT revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/privacy/export:
    post:
      tags: [Privacy]
      operationId: requestPrivacyExport
      summary: Create a subject data export request.
      description: |-
        Records a subject data export request for the supplied subject_ref and
        returns a receipt. Requires the data:export action (MFA-gated when MFA
        is enabled). Answers 501 when privacy request handling is not enabled.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacySubjectRequest"
      responses:
        "202":
          description: Privacy request recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/privacy/erase:
    post:
      tags: [Privacy]
      operationId: requestPrivacyErase
      summary: Create a subject data erasure request.
      description: |-
        Records a GDPR Art. 17 style erasure request for the supplied
        subject_ref and returns a receipt. Erasure is gated on its own
        data:erase action (not data:export) because it is destructive and
        irreversible. Answers 501 when privacy request handling is not
        enabled.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacySubjectRequest"
      responses:
        "202":
          description: Privacy request recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/webhooks/secret:rotate:
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate a webhook signing secret.
      description: |-
        Records a rotation of the signing secret for a webhook destination.
        Only opaque secret references are accepted (new_secret_ref); plaintext
        secrets are rejected by payload policy. An optional overlap_seconds
        window keeps the previous secret valid. Idempotent with
        Idempotency-Key; a replay returns the stored rotation. Requires the
        secret:rotate action (MFA-gated when MFA is enabled). Answers 501 when
        webhook secret rotation is not configured.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSecretRotateRequest"
      responses:
        "200":
          description: Secret rotated (or idempotent replay of a prior rotation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretRotateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: Idempotency key conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Body exceeds the gateway request body limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/sso/oidc/authorize:
    get:
      tags: [SSO]
      operationId: ssoOIDCAuthorize
      summary: Start the OIDC authorization-code flow.
      description: |-
        Browser redirect entry point for the OIDC authorization-code flow.
        Generates a random state+nonce pair (state is stored with a 10 minute
        TTL) and redirects the browser to the configured IdP authorization
        URL. Unauthenticated by design: the browser does not hold a UBAG
        credential yet. Answers 400 when the tenant has no OIDC configuration
        or it lacks an authorization_url, and 501 when the authorization-code
        flow is not configured.
      security: []
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: redirect_uri
          in: query
          required: false
          description: Optional redirect URI forwarded to the IdP authorization request.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the IdP authorization URL.
          headers:
            Location:
              description: IdP authorization URL carrying response_type, client_id, scope, state, nonce, and optional redirect_uri.
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/admin/regions/{region}/state:
    post:
      tags: [Admin]
      operationId: setRegionState
      summary: Set the lifecycle state of a region.
      description: |-
        Transitions a region between active, draining, and disabled through
        the kill-switch registry. Invalid states or transitions are rejected
        with 400. Requires the region:manage action (MFA-gated when MFA is
        enabled). Answers 501 when the region kill switch is not enabled.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: region
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionStateRequest"
      responses:
        "204":
          description: Region state updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: Body exceeds the gateway request body limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/mfa/enroll:
    post:
      tags: [MFA]
      operationId: enrollMFA
      summary: Enroll the current principal in TOTP MFA.
      description: |-
        Enrolls the caller's principal in TOTP-based MFA and returns the
        base32 secret, an otpauth:// URI for QR scanning, and one-time
        recovery codes. The secret and recovery codes are shown once and must
        be stored by the caller. Answers 501 when MFA is not enabled.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                issuer:
                  type: string
                  description: Optional issuer label shown in the authenticator app. Defaults to UBAG.
      responses:
        "200":
          description: Enrollment material generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAEnrollResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/mfa/verify:
    post:
      tags: [MFA]
      operationId: verifyMFA
      summary: Verify a TOTP or recovery code for the current session.
      description: |-
        Verifies a TOTP or recovery code for the caller's principal and marks
        the current session MFA-verified, unlocking MFA-gated privileged
        actions. Answers 401 for an invalid or expired code and 501 when MFA
        is not enabled.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: Code accepted; the session is MFA-verified.
          headers:
            X-MFA-Verified:
              description: Set to true on success.
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAVerifyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/admin/elevation:
    post:
      tags: [Admin]
      operationId: requestElevation
      summary: Request a just-in-time elevated role grant.
      description: |-
        Creates a JIT elevation grant request for the caller's session
        subject. ttl_seconds is capped at 86400 (24h). The grant stays
        inactive until a sufficiently senior approver approves it. Bearer
        secrets and machine API keys cannot request elevation (400) because
        they carry no subject. Answers 501 when JIT elevation is not enabled.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElevationRequest"
      responses:
        "201":
          description: Elevation grant created (not yet active).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevationGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: Body exceeds the gateway request body limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/admin/elevation/{id}/approve:
    post:
      tags: [Admin]
      operationId: approveElevation
      summary: Approve a pending elevation grant.
      description: |-
        Approves a pending JIT elevation grant. An approver may never approve
        a grant whose role outranks the approver's own (403); expired grants
        are rejected with 409. Requires the role:manage action (MFA-gated when
        MFA is enabled).
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Elevation grant approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevationGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: Elevation grant has expired and cannot be approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/antigravity/accounts/{id}:
    put:
      tags: [Antigravity]
      operationId: updateAntigravityAccount
      summary: Update a tenant-owned OAuth CLI account.
      description: |-
        Updates the enabled flag (and label/tier in the request shape) of a
        tenant-owned Antigravity OAuth account. Requires the role:manage
        action. Answers 404 when the account does not exist.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^acct_[0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AntigravityAccountUpdateRequest"
      responses:
        "200":
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntigravityAccountMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: Body exceeds the gateway request body limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Antigravity]
      operationId: deleteAntigravityAccount
      summary: Remove a tenant-owned OAuth CLI account.
      description: |-
        Removes the account from the tenant. Requires the role:manage action.
        Answers 404 when the account does not exist.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^acct_[0-9]+$"
      responses:
        "200":
          description: Account removed; removed echoes the account ID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [removed]
                properties:
                  removed:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/antigravity/config:
    get:
      tags: [Antigravity]
      operationId: getAntigravityConfig
      summary: Get the Antigravity CLI account configuration.
      description: Returns the default model, default effort, concurrency cap, tenant account count, and whether Antigravity OAuth is enabled. Requires the role:manage action.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      responses:
        "200":
          description: Antigravity configuration returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntigravityConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    put:
      tags: [Antigravity]
      operationId: putAntigravityConfig
      summary: Update the Antigravity CLI account configuration.
      description: Upserts the default model, default effort, and concurrency cap. Requires the role:manage action.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AntigravityConfigUpdateRequest"
      responses:
        "200":
          description: Antigravity configuration stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntigravityConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: Body exceeds the gateway request body limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/antigravity/test:
    post:
      tags: [Antigravity]
      operationId: testAntigravity
      summary: Run a canary prompt through an Antigravity CLI account.
      description: |-
        Creates a chat.prompt canary job on the antigravity_cli target and
        records it as the account's latest verification job. Idempotent with
        Idempotency-Key (same semantics as job creation). Requires the
        role:manage action. Answers 503 when Antigravity OAuth is disabled,
        404 when the requested account_id does not exist, and 409 when the
        account is disabled.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AntigravityTestRequest"
      responses:
        "202":
          description: Canary job accepted.
          headers:
            Location:
              description: URL of the canary job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntigravityTestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: Account is disabled or idempotency key conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Body exceeds the gateway request body limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Queue backpressure or target concurrency ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Antigravity OAuth CLI is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/quotas/antigravity:
    get:
      tags: [Antigravity]
      operationId: getAntigravityQuota
      summary: Get Antigravity OAuth quota state.
      description: |-
        Stub route: quota collection is not configured on any deployment, so
        the gateway answers 501 (Not Implemented envelope) while the route and
        its role:manage gate stay reserved.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Antigravity]
      operationId: refreshAntigravityQuota
      summary: Refresh Antigravity OAuth quota state.
      description: |-
        Stub route: quota collection is not configured on any deployment, so
        the gateway answers 501 (Not Implemented envelope) while the route and
        its role:manage gate stay reserved.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/quotas/antigravity/refresh:
    post:
      tags: [Antigravity]
      operationId: refreshAntigravityQuotaExplicit
      summary: Refresh Antigravity OAuth quota state (explicit refresh route).
      description: |-
        Stub route served by the same handler as POST /v1/quotas/antigravity.
        Quota collection is not configured on any deployment, so the gateway
        answers 501 (Not Implemented envelope) while the route and its
        role:manage gate stay reserved.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /v1/quotas/antigravity/{account}:
    get:
      tags: [Antigravity]
      operationId: getAntigravityAccountQuota
      summary: Get quota state for one Antigravity OAuth account.
      description: |-
        Stub route: per-account quota collection is not configured on any
        deployment, so the gateway answers 501 (Not Implemented envelope)
        while the route and its role:manage gate stay reserved.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - name: account
          in: path
          required: true
          schema:
            type: string
            pattern: "^acct_[0-9]+$"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "501":
          $ref: "#/components/responses/NotImplemented"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: App-secret or token bearer credential issued by UBAG.
  parameters:
    UbagApiVersion:
      name: Ubag-Api-Version
      in: header
      required: false
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        examples: ["2026-05-22"]
      description: Requested behavior version. Request bodies with api_version must match this header.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
        examples: ["01HXY5ZS3KAFQ3PZ8NQ8C7H1AT"]
      description: Required idempotency key for mutating routes.
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^job_[A-Za-z0-9]+$"
      description: UBAG job identifier.
    ArtifactKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: "^[^/\\\\]+$"
      description: Single path segment artifact key scoped to the job.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
      description: Opaque pagination cursor.
    JobEventCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Numeric event sequence cursor alias for after_sequence. If both cursor and after_sequence are supplied, they must match.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum number of records to return.
  headers:
    UbagApiVersionUsed:
      description: Behavior version used for this response.
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        examples: ["2026-05-22"]
    UbagTraceId:
      description: Cross-component trace identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: Request syntax, query, or header validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid caller credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Caller is authenticated but not authorized for the tenant, app, resource, or action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource was not found or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the resource's current state (for example an expired or terminated voice session).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: The route exists but does not allow this HTTP method.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Caller exceeded an applicable rate limit.
      headers:
        Retry-After:
          description: Seconds until the caller should retry.
          schema:
            type: integer
            minimum: 0
        RateLimit-Limit:
          description: Maximum requests in the current window.
          schema:
            type: integer
            minimum: 0
        RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
            minimum: 0
        RateLimit-Reset:
          description: Epoch seconds when the current rate-limit window resets.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected service error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: The route exists but its backing subsystem is not configured on this deployment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AntigravityAccount:
      type: object
      required: [account_id, label, enabled, tier, worker_socket_present, verification_state]
      properties:
        account_id:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        tier:
          type: string
        worker_socket_present:
          type: boolean
          description: Socket presence is not proof of authentication.
        verification_state:
          type: string
          enum: [unverified, pending, verified, failed]
        verification_job_id:
          type: string
          description: Latest tenant-owned account-pinned canary job, if any.
        verified_at:
          type: string
          format: date-time
          description: Timestamp of the last completed pinned canary, not a live OAuth status check.
    AntigravityLoginSession:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [not_started, starting, awaiting_code, verifying, closed, stopped]
        authorization_url:
          type: string
          format: uri
          pattern: "^https://"
    JobRequest:
      $ref: ../shared-schemas/schemas/job-request.schema.json
    JobResponse:
      $ref: ../shared-schemas/schemas/job-response.schema.json
    ErrorResponse:
      $ref: ../shared-schemas/schemas/error.schema.json
    JobEvent:
      $ref: ../shared-schemas/schemas/job-event.schema.json
    VoiceSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 64
        identity_ref:
          description: Preferred provider account (topology identity ref). The claim stays tenant-scoped.
          type: string
          maxLength: 256
        ttl_seconds:
          description: Lease window between renewals (30..3600).
          type: integer
          minimum: 30
          maximum: 3600
        mode:
          description: >-
            "live" (default) is a two-way voice session holding exclusive
            leases; "utterance" is the separately selected audio-in/text-out
            mode backed by a transcription job (response carries job_id).
            A live session is never substituted with an utterance job.
          type: string
          enum: [live, utterance]
    VoiceSessionResponse:
      type: object
      additionalProperties: false
      required: [kind, session]
      properties:
        kind:
          type: string
          enum: [voice_session]
        session_id:
          type: string
        target:
          type: string
        status:
          type: string
          enum: [queued, connecting, connected, terminated]
        mode:
          type: string
          enum: [live, utterance]
        job_id:
          description: Backing transcription job (utterance mode only).
          type: string
        next:
          description: Human-readable next step (utterance mode only).
          type: string
        session:
          type: object
          additionalProperties: true
    VoiceSessionConnectRequest:
      type: object
      additionalProperties: false
      required: [sdp_offer]
      properties:
        sdp_offer:
          type: string
          minLength: 1
          maxLength: 131072
    VoiceSessionConnectResponse:
      type: object
      additionalProperties: false
      required: [kind, session_id, status]
      properties:
        kind:
          type: string
          enum: [voice_session_connection]
        session_id:
          type: string
          minLength: 1
        status:
          type: string
        sdp_answer:
          type: string
        media_credential:
          description: Short-lived HMAC credential scoped to this session's media path.
          type: string
        media_credential_expires_ms:
          type: integer
          format: int64
        ice_servers:
          description: >-
            STUN/TURN servers (TURN with time-limited credentials) the client
            must configure its RTCPeerConnection with.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [urls]
            properties:
              urls:
                type: array
                items:
                  type: string
              username:
                type: string
              credential:
                type: string
    CollectionResponse:
      type: object
      additionalProperties: false
      required: [api_version, kind, data, next_cursor, trace_id]
      properties:
        api_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        kind:
          type: string
          enum:
            - events
            - workflows
            - templates
            - targets
            - adapters
            - apps
            - devices
            - webhooks
            - audit
            - capabilities
            - voice_sessions
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: ["string", "null"]
        trace_id:
          type: string
          minLength: 1
    WorkflowStepInput:
      type: object
      additionalProperties: false
      required: [id, target, command]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        target:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        command:
          type: string
          minLength: 1
          maxLength: 128
        template_id:
          type: string
          maxLength: 160
        input:
          type: object
          additionalProperties: true
        continue_on_error:
          type: boolean
        depends_on:
          type: array
          description: Step IDs that must succeed before this step dispatches. Empty means the previous step (linear chain).
          items:
            type: string
            minLength: 1
    WorkflowCreateRequest:
      type: object
      additionalProperties: false
      required: [name, steps]
      properties:
        api_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        name:
          type: string
          minLength: 1
          maxLength: 160
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkflowStepInput"
    WorkflowDefinition:
      type: object
      additionalProperties: false
      required: [api_version, id, name, steps, created_at, trace_id]
      properties:
        api_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        id:
          type: string
        name:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStepInput"
        created_at:
          type: string
          format: date-time
        trace_id:
          type: string
          minLength: 1
    Alert:
      type: object
      additionalProperties: true
      required: [alert_id, tenant_id, app_id, job_id, kind, status, created_at]
      properties:
        alert_id:
          type: string
        tenant_id:
          type: string
        app_id:
          type: string
        job_id:
          type: string
        session_id:
          type: string
        target_id:
          type: string
        kind:
          type: string
          description: Manual-action kind, e.g. captcha, manual_login, or verification.
        message:
          type: string
        status:
          type: string
          enum: [open, notified, acknowledged, resolved, expired]
        created_at:
          type: string
          format: date-time
        notified_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties: true
    AlertListResponse:
      type: object
      additionalProperties: false
      required: [api_version, kind, data, next_cursor, trace_id]
      properties:
        api_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        kind:
          type: string
          const: alerts
        data:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        next_cursor:
          type: ["string", "null"]
        trace_id:
          type: string
          minLength: 1
    AlertMutationResponse:
      type: object
      additionalProperties: false
      required: [api_version, kind, data, trace_id]
      properties:
        api_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        kind:
          type: string
          const: alert
        data:
          $ref: "#/components/schemas/Alert"
        trace_id:
          type: string
          minLength: 1
    AlertConfig:
      type: object
      additionalProperties: false
      description: >-
        Secret-free description of the alerting configuration. SMTP credentials
        and any password field are intentionally absent.
      required: [api_version, kind, sink_type, smtp_configured, recipient_count, trace_id]
      properties:
        api_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        kind:
          type: string
          const: alert_config
        sink_type:
          type: string
        smtp_configured:
          type: boolean
        smtp_host:
          type: string
          description: SMTP host only; credentials are never included.
        store_kind:
          type: string
        recipient_count:
          type: integer
          minimum: 0
        recipients:
          type: array
          items:
            type: string
        trace_id:
          type: string
          minLength: 1
    ConversationListResponse:
      type: object
      additionalProperties: false
      required: [api_version, conversations]
      properties:
        api_version:
          type: string
        conversations:
          type: array
          items:
            type: object
