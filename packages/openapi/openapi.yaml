  /v1/openai/chat/completions:
    post:
      tags: [OpenAICompat]
      operationId: createOpenAIChatCompletion
      summary: Create an OpenAI-compatible chat completion.
      description: |
        Synchronous OpenAI-compatible chat completion backed by a UBAG job.
        The gateway creates a native job (target derived from `model`), waits
        for its terminal state up to the configured facade deadline
        (UBAG_FACADE_MAX_WAIT_MS, default 240000 ms), and returns an OpenAI
        `chat.completion` object. `model` is a UBAG target key (for example
        `chatgpt_web`) or `target|setting` (for example
        `chatgpt_web|GPT-5.6 Sol`); the available values are listed by
        GET /v1/openai/models. `stream:true` and tools/function calling are
        rejected: UBAG has no end-to-end token streaming and no tool protocol.
        `response_format` serves JSON coercion only (`json_object` /
        `json_schema`: the completion text is reduced to its first parseable
        JSON value, and the call fails loudly when nothing parses); any other
        shape is rejected. Multimodal content parts are rejected — send files
        via `ubag_attachments` (below) or multipart to POST /v1/jobs instead.
        Message history is flattened into one
        prompt (system messages first, then turns in order); there is no
        role-aware tool/result interpretation. File attachments
        (PDF/image/audio/video/voice) are supported: declare them in
        `ubag_attachments` (each `{key, content_type, kind, [filename]}`).
        A declaring call answers 202 with the held `ubag_job_id`; upload each
        key with `PUT /v1/jobs/{ubag_job_id}/artifacts/{key}` and the job
        dispatches once every declared key lands — then poll
        `GET /v1/jobs/{ubag_job_id}` or replay the same facade body to
        resolve the chat.completion. Declarations are validated against the
        target adapter's attachments policy (see GET /v1/adapters); a target
        with no policy rejects attachments. The provider web UI processes
        the files and its answer becomes the completion text. A multipart
        one-shot to POST /v1/jobs (first part `job` = this envelope, then one
        file part per declared key) dispatches immediately instead. Token usage is estimated from
        character counts because browser workers report DOM deltas, not model
        tokens. When the deadline expires first the facade answers 504 with
        the ubag_job_id so the caller can poll the native job API. Retrying
        an identical body replays the same job: the facade derives the native
        idempotency key from the caller principal plus the request hash
        (including attachment declarations).
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAIChatCompletionRequest"
      responses:
        "200":
          description: Completion finished within the facade deadline.
          headers:
            Ubag-Api-Version-Used:
              $ref: "#/components/headers/UbagApiVersionUsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIChatCompletionResponse"
        "202":
          description: Attachment-declaring call accepted; the native job is held until every declared artifact key is uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIChatCompletionAccepted"
        "400":
          description: Rejected request (streaming, tools, unknown model, empty messages).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "401":
          description: Missing or invalid credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "429":
          description: Queue backpressure or concurrency ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "500":
          description: Job creation or dispatch failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "503":
          description: Provider unavailable (login required, adapter drift, region draining).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "504":
          description: Facade deadline expired before the job reached a terminal state; ubag_job_id identifies the still-running job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
  /v1/openai/models:
    get:
      tags: [OpenAICompat]
      operationId: listOpenAIModels
      summary: List OpenAI-compatible model IDs.
      description: |
        Lists the model IDs accepted by POST /v1/openai/chat/completions: one
        entry per UBAG target plus one `target|setting` entry per
        caller-selectable model-catalog value. Entries mirror the same adapter
        manifests the native create path validates against.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      responses:
        "200":
          description: Model list returned.
          headers:
            Ubag-Api-Version-Used:
              $ref: "#/components/headers/UbagApiVersionUsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIModelList"
        "401":
          description: Missing or invalid credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "429":
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "500":
          description: Model catalog could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
  /v1/openai/audio/transcriptions:
    post:
      tags: [OpenAICompat]
      operationId: createOpenAITranscription
      summary: Transcribe audio via a held native job.
      description: |
        OpenAI-shaped multipart upload (`file` audio part + optional
        `model`/`language`/`prompt` fields) bridged onto one native job with
        the audio attached as a `voice` artifact. The provider web UI does the
        listening; the gateway answers `{text, ubag_job_id}` once the job is
        terminal, or 504 with the job ID when the facade deadline expires
        first. `model: whisper-1` (or blank) selects the operator-default
        live target; a bare UBAG target pins the provider. Audio MIME types
        are allowlisted (webm/wav/mpeg/mp4/ogg); the part is capped at 24 MiB.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                language:
                  type: string
                prompt:
                  type: string
      responses:
        "200":
          description: Transcription finished within the facade deadline.
          headers:
            Ubag-Api-Version-Used:
              $ref: "#/components/headers/UbagApiVersionUsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAITranscriptionResponse"
        "400":
          description: Rejected upload (missing file, unsupported audio type, malformed multipart).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "401":
          description: Missing or invalid credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "413":
          description: Audio part exceeds the 24 MiB transcription limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "429":
          description: Queue backpressure or concurrency ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "500":
          description: Job creation, dispatch, or transcript extraction failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "503":
          description: Provider unavailable (login required, adapter drift, region draining).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "504":
          description: Facade deadline expired before the job reached a terminal state; ubag_job_id identifies the still-running job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
  /v1/openai/embeddings:
    post:
      tags: [OpenAICompat]
      operationId: createOpenAIEmbedding
      summary: Deterministic hash embeddings in the OpenAI shape.
      description: |
        Accepts the OpenAI embeddings request shape (`model`, `input` as a
        string or array of strings, optional `dimensions` 1..1536) and answers
        in the exact OpenAI embeddings response shape. The vectors are
        deterministic SHA-256-chained unit vectors, NOT semantic embeddings:
        no model runs, so cosine neighbours mean "same bytes", never "same
        meaning". At most 20 inputs per call. Callers that need semantic
        retrieval must keep a real embedding provider.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAIEmbeddingRequest"
      responses:
        "200":
          description: Embeddings computed.
          headers:
            Ubag-Api-Version-Used:
              $ref: "#/components/headers/UbagApiVersionUsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIEmbeddingResponse"
        "400":
          description: Rejected request (missing model, empty input, too many inputs, bad dimensions).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "401":
          description: Missing or invalid credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "429":
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
        "500":
          description: Embedding computation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIErrorResponse"
  /v1/antigravity/accounts:
    get:
      tags: [Antigravity]
