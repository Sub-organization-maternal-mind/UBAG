        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
        name:
          type: string
    OpenAIChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          type: string
          minLength: 1
          description: UBAG target key (for example chatgpt_web) or target|setting (for example chatgpt_web|GPT-5.6 Sol).
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OpenAIChatMessage"
        temperature:
          type: number
          description: Accepted and forwarded as a hint; browser providers may ignore it.
        max_tokens:
          type: integer
          minimum: 1
        stream:
          type: boolean
          default: false
          description: Must be false or omitted; streaming is rejected with 400.
        top_p:
          type: number
          description: Accepted but ignored by the facade.
        tools:
          description: Rejected with 400 when non-empty; UBAG has no tool protocol.
        tool_choice:
          description: Rejected with 400 when set; UBAG has no tool protocol.
        response_format:
          description: JSON coercion only ({type json_object} or {type json_schema}); the completion text is reduced to its first parseable JSON value and the call fails loudly when nothing parses. Any other shape is rejected with 400.
        ubag_wait_ms:
          type: integer
          minimum: 1000
          description: Per-request facade wait deadline in milliseconds, capped by the server maximum.
        ubag_nonce:
          type: string
          description: Optional caller nonce included in the idempotency fingerprint. Reuse it to retry the same native job; change it to make an otherwise identical request create a distinct job.
        ubag_strict:
          type: boolean
          description: Opt out of strict picker config. When omitted or true (default), the operator's model/reasoning settings — explicit model_settings or per-provider selector defaults — are enforced on-page before the job runs, and a drifted provider model menu fails the job as selector_drift_detected. Explicit false marks the job best-effort (a drifted menu is skipped and the prompt submits in the account's current mode — not recommended).
        ubag_attachments:
          type: array
          maxItems: 32
          description: Native attachment declarations ({key, content_type, kind, [filename]}) for PDF/image/audio/video/voice files. The declaring facade call answers 202 with the held ubag_job_id; upload each declared key with PUT /v1/jobs/{ubag_job_id}/artifacts/{key} and the job dispatches once every key lands — then poll GET /v1/jobs/{ubag_job_id} or replay the facade body to resolve the chat.completion. Validated against the target adapter attachments policy (see GET /v1/adapters); a target with no policy rejects attachments.
          items:
            type: object
            additionalProperties: false
            required: [key, content_type, kind]
            properties:
              key:
                type: string
                minLength: 1
              content_type:
                type: string
                minLength: 1
              kind:
                type: string
                enum: [document, image, audio, video, voice]
              filename:
                type: string
    OpenAIChatChoice:
      type: object
      additionalProperties: false
      required: [index, message, finish_reason]
      properties:
        index:
          type: integer
