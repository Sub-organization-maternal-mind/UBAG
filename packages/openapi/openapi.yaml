          description: Current human-operated CLI session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntigravityLoginSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The account worker returned an invalid or unsuccessful login response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The isolated account worker is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Antigravity]
      operationId: postAntigravityLoginSession
      summary: Start an isolated CLI session or relay human terminal input.
      description: Requires role:manage. Starting a new sign-in clears previous canary verification. Input is sent once to the account worker and must not be logged or persisted by UBAG.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action:
                  type: string
                  enum: [start, input]
                input:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[A-Za-z0-9-]+$"
      responses:
        "200":
          description: CLI session state after the requested human action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntigravityLoginSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The account worker returned an invalid or unsuccessful login response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The isolated account worker is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Antigravity]
      operationId: deleteAntigravityLoginSession
      summary: Stop and clear the isolated CLI login session.
      description: Requires role:manage. Does not delete the CLI's keyring credentials.
      responses:
        "200":
          description: CLI terminal stopped; output and authorization URL cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntigravityLoginSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The account worker returned an invalid or unsuccessful login response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The isolated account worker is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/jobs/batch:
    post:
      tags: [Jobs]
      operationId: createJobBatch
      summary: Create up to 100 jobs in one request.
      description: |-
        Accepts up to 100 job submissions in one HTTP round-trip and returns an
        outcome per entry. Individual failures do not abort the batch: each
        entry carries its own accepted/rejected status and error. Requires a
        batch-level Idempotency-Key (header) or idempotency_key body field;
        entries without an explicit key derive theirs deterministically from
        the batch key so a retried batch stays idempotent per entry. Answers
        202 when every entry was accepted and 207 (multi-status) otherwise.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateJobRequest"
      responses:
        "202":
          description: Every batch entry was accepted.
          headers:
            Ubag-Api-Version-Used:
              $ref: "#/components/headers/UbagApiVersionUsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateJobResponse"
        "207":
          description: Multi-status; at least one batch entry was rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: Batch body exceeds the gateway request body limit.
          content:
            application/json:
