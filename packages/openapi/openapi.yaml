      tags: [Workflows]
      operationId: createWorkflowRun
      summary: Create and start a run of a workflow definition.
      description: |-
        Creates a run for an existing workflow definition and immediately
        advances it: each first-wave step becomes a regular gateway job
        dispatched through the executor. Requires the job:create action and an
        Idempotency-Key. The Location header points at the run resource.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
