      tags: [SCIM]
      operationId: createSCIMUser
      summary: Create a SCIM user.
      description: Creates a SCIM user from an RFC 7643 core User resource. The password attribute is accepted on write only and is never returned. Requires the role:manage action.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
