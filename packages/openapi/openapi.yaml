          format: date-time
          description: Absent for never-expiring PATs.
        trace_id:
          type: string
          minLength: 1
    PrivacySubjectRequest:
      type: object
      additionalProperties: false
      required: [subject_ref]
      properties:
        subject_ref:
          type: string
          minLength: 1
    PrivacyRequestReceipt:
      type: object
      additionalProperties: false
      required: [api_version, request_id, kind, status, receipt, created_at, trace_id]
      properties:
        api_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        request_id:
          type: string
        kind:
          type: string
          description: Privacy request kind (export or erase).
        status:
          type: string
        receipt:
          type: string
        created_at:
          type: string
          format: date-time
        trace_id:
          type: string
          minLength: 1
    WebhookSecretRotateRequest:
      type: object
      additionalProperties: false
      required: [webhook_id, new_secret_ref]
      properties:
        api_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        webhook_id:
          type: string
          minLength: 1
        new_secret_ref:
          type: string
          minLength: 1
          description: Opaque secret reference for the new signing secret. Plaintext secrets are rejected by payload policy.
        overlap_seconds:
          type: integer
          minimum: 0
          description: Optional window during which the previous secret stays valid.
    WebhookSecretRotateResponse:
      type: object
      additionalProperties: false
      required: [api_version, status, webhook_id, active_secret_ref, trace_id]
      properties:
        api_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        status:
          type: string
          enum: [rotated]
        webhook_id:
          type: string
        active_secret_ref:
          type: string
        previous_secret_ref:
          type: string
          description: Present when a prior rotation existed for the webhook.
        overlap_until:
          type: string
          format: date-time
          description: Present when overlap_seconds was requested.
        trace_id:
          type: string
          minLength: 1
    RegionStateRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [active, draining, disabled]
    MFAEnrollResponse:
      type: object
      additionalProperties: false
      required: [secret, otpauth_uri, recovery_codes]
      description: Shown once; the caller must persist the secret and recovery codes.
      properties:
        secret:
          type: string
          description: Base32 TOTP secret.
        otpauth_uri:
          type: string
          description: otpauth:// URI for QR scanning.
        recovery_codes:
          type: array
          items:
            type: string
    MFAVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: TOTP code or one-time recovery code.
    MFAVerifyResponse:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified:
          type: boolean
          const: true
    ElevationRequest:
      type: object
      additionalProperties: false
      required: [role, ttl_seconds]
      properties:
        role:
          type: string
          description: Elevated role being requested; must be a known gateway role.
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Requested elevation window in seconds, capped at 24h.
        reason:
          type: string
    ElevationGrant:
      type: object
      additionalProperties: false
      required: [id, actor, tenant_id, app_id, role, reason, ttl_seconds, expires_at, approved, created_at, revoked]
      properties:
        id:
          type: string
        actor:
          type: string
          description: Subject of the requesting principal.
        tenant_id:
          type: string
        app_id:
          type: string
        role:
          type: string
        reason:
          type: string
        ttl_seconds:
          type: integer
          format: int64
          description: Raw Go time.Duration value (nanoseconds) as serialized by the gateway.
        expires_at:
          type: string
          format: date-time
        approved:
          type: boolean
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        revoked:
          type: boolean
    AntigravityAccountUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Defaults to true when omitted.
        label:
          type: string
        tier:
          type: string
    AntigravityAccountMutationResponse:
      type: object
      additionalProperties: false
      required: [account_id, label, enabled, tier]
      properties:
        account_id:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        tier:
          type: string
    AntigravityConfig:
      type: object
      additionalProperties: false
      required: [default_model, default_effort, max_concurrent, account_count, oauth_enabled]
      properties:
        default_model:
          type: string
        default_effort:
          type: string
        max_concurrent:
          type: integer
        account_count:
          type: integer
          minimum: 0
          description: Number of tenant-owned accounts, computed per request.
        oauth_enabled:
          type: boolean
    AntigravityConfigUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        default_model:
          type: string
        default_effort:
          type: string
        max_concurrent:
          type: integer
    AntigravityTestRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        model:
          type: string
          description: Defaults to the configured default_model.
        account_id:
          type: string
          pattern: "^acct_[0-9]+$"
          description: Optional account pin. When supplied the canary result updates that account's verification state.
    AntigravityTestAccepted:
      type: object
      additionalProperties: false
      required: [job_id, status, model, message]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [accepted]
        model:
          type: string
        message:
          type: string
