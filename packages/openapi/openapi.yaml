      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRunCreateRequest"
      responses:
        "202":
          description: Workflow run created and advancing.
          headers:
            Location:
              description: URL of the workflow run.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
