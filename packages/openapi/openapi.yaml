          type: string
          pattern: "^acct_[0-9]+$"
    get:
      tags: [Antigravity]
      operationId: getAntigravityLoginSession
      summary: Poll the tenant-owned account's CLI login session.
      description: Requires role:manage. Authorization URL is transient; never use it as proof of sign-in. CLI output is not exposed.
      responses:
