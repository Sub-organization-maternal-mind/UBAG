              created_at:
                type: string
                format: date-time
              last_used_at:
                type: string
                format: date-time
              last_job_id:
                type: string
        next_cursor:
          type: ["string", "null"]
    BrowserInstance:
      type: object
      additionalProperties: false
      required: [instance_id, worker_id, tenant_id, engine, state, context_count, tab_count, created_at]
      properties:
        instance_id:
          type: string
        worker_id:
          type: string
        tenant_id:
          type: string
        engine:
          type: string
        remote_endpoint:
          type: string
        state:
          type: string
        context_count:
          type: integer
          minimum: 0
        tab_count:
          type: integer
          minimum: 0
        rss_bytes:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        recycle_at:
          type: string
          format: date-time
    ProviderContext:
      type: object
      additionalProperties: false
      description: >-
