      tags: [SCIM]
      operationId: listSCIMUsers
      summary: List SCIM users.
      description: |-
        RFC 7644 user listing with startIndex/count paging and a single-attr
        eq filter. Responses use application/scim+json and SCIM error shapes.
        Clients do not send Idempotency-Key; the gateway waives it for SCIM.
