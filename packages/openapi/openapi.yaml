        instance_id:
          type: string
        tenant_id:
          type: string
        target_id:
          type: string
        identity_ref:
          type: string
        login_state:
          type: string
        conversation_model:
          type: string
        fingerprint_id:
          type: string
        proxy_id:
          type: string
        has_storage_state:
          type: boolean
          description: Whether a persisted storage state exists. The URI itself is never exposed.
        max_tabs:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        last_health_at:
          type: string
          format: date-time
        recycle_at:
          type: string
          format: date-time
    BrowserTab:
