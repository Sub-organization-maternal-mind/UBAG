        identity_ref:
          type: string
        current_cap:
          type: integer
          minimum: 0
        min:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 0
        in_flight:
          type: integer
          minimum: 0
        last_change_reason:
          type: string
        last_change_at:
          type: string
          format: date-time
    BrowserInstanceListResponse:
      type: object
      additionalProperties: false
      required: [api_version, kind, data, next_cursor, trace_id]
      properties:
        api_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        kind:
          type: string
