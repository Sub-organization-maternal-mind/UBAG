  /v1/jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List jobs.
      description: Returns a cursor-paginated list of jobs visible to the caller.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: filter[status]
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobStatus"
          description: Filter jobs by current status.
        - name: filter[target]
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9._-]*$"
          description: Filter jobs by target adapter key.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [created_at, -created_at]
            default: -created_at
      responses:
        "200":
          description: Jobs returned.
          headers:
            Ubag-Api-Version-Used:
              $ref: "#/components/headers/UbagApiVersionUsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Create a job.
      description: |
        Creates or replays a job submission. Idempotency-Key is required for
        raw REST calls and must match requestBody.idempotency_key when both are present.
        Executable payload sections are rejected before storage or executor dispatch
        when they contain credentials, cookies, tokens, API keys, browser session
        state, client-supplied noVNC URLs, private keys, MFA/TOTP material, or
        CAPTCHA-solving instructions.

        Attachments (documents/images/audio/video/voice) are supported two ways:
        - **Key-reference (application/json):** declare files in `job.input.attachments`
          (each `{key, content_type, kind}`), then upload the bytes with
          `PUT /v1/jobs/{job_id}/artifacts/{key}`. The job is held (status `created`)
          and only dispatches once every declared key has been uploaded.
        - **Multipart one-shot (multipart/form-data):** send the `job` JSON envelope as
          the first part, then one binary file part per declared attachment whose part
          field name equals the attachment `key`. The job is born complete and dispatches
          immediately.

        Each attachment's actual multipart/upload MIME type must exactly match its
        declared `content_type`, which is validated against the target adapter's
        attachments policy (see `GET /v1/adapters`); a target with no policy rejects
        attachments. The hard manifest ceiling is 32 files. The currently exposed
        ChatGPT, Gemini, and DeepSeek dashboard targets allow 10 files, 32 MiB per
        file, and a derived 320 MiB total.
      parameters:
        - $ref: "#/components/parameters/UbagApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
            examples:
              basicJob:
                summary: Accepted browser automation job.
                value:
                  api_version: "2026-05-22"
                  idempotency_key: 01HXY5ZS3KAFQ3PZ8NQ8C7H1AT
                  client:
                    app_id: radiology-reporting-windows
                    app_version: 1.4.2
                    device_id: dev_01HX
                    user_ref: user@example.com
                    sdk:
                      name: ubag-dotnet
                      version: 2.0.1
                  job:
                    target: deepseek_web
                    command_type: medical_report_generation
                    conversation_id: conv_123
                    template_id: radiology_ct_brain_v3
                    not_before: "2026-07-01T09:30:00Z"
                    input: {}
                    options:
                      priority: normal
                      timeout_seconds: 180
                      return_mode: accepted
                      response_formats: [markdown, plain_text]
                      retry_policy: default
                      cache_policy: semantic_30d
                    callbacks:
                      webhook_url: https://app.example.com/ubag/callback
                      webhook_secret_id: wh_sec_abc
                    context:
                      locale: en-GB
                      tags: [radiology]
                      cost_center: rad-dept
          multipart/form-data:
            schema:
              type: object
              required: [job]
              properties:
                job:
                  $ref: "#/components/schemas/JobRequest"
              additionalProperties:
                type: string
                format: binary
                description: >-
                  One binary file part per declared attachment. The part field
                  name MUST equal the corresponding job.input.attachments[].key.
            encoding:
              job:
                contentType: application/json
      responses:
        "202":
          description: Job accepted or idempotent response replayed.
          headers:
            Location:
              description: URL of the created or replayed job.
              schema:
                type: string
                examples: [/v1/jobs/job_01HXY5ZS3KAFQ3PZ8NQ8C7H1AU]
            Ubag-Api-Version-Used:
              $ref: "#/components/headers/UbagApiVersionUsed"
            Ubag-Trace-Id:
              $ref: "#/components/headers/UbagTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency key conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: A multipart attachment exceeds its 32 MiB per-file limit or the policy-derived total limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Job request failed schema or command validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
