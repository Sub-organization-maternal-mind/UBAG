name: gofmt-fix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rectification
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/gateway/go.mod
      - name: gofmt the jobs package
        run: |
          cd apps/gateway
          unformatted=$(gofmt -l .)
          echo "unformatted: $unformatted"
          gofmt -w .
          git config user.name "ubag-ci-fmt"
          git config user.email "ci@ubag.local"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "style(gateway): gofmt via CI (automated)"
            git push
          fi
