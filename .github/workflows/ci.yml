# UBAG continuous integration: language checking, linting and compile checks only.
# Automated tests were removed on 2026-10-08 (last commit with tests: tag pre-strip-tests).
# The production deploy in gateway-image.yml does not depend on this workflow.
name: ci

on:
  # perf/** is included because perf/latency-az deploys straight to prod via
  # gateway-image.yml; without it, prod-bound commits were never linted.
  push:
    branches: [main, "feat/**", "release/**", "perf/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; new pushes cancel stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "10.33.2"
  GO_VERSION: "1.26.x"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint & contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI, JSON Schema, proto, blueprint, REST and SDK contracts
        run: pnpm lint
      - uses: actions/setup-go@v7
        with: { go-version-file: apps/gateway/go.mod, cache-dependency-path: apps/gateway/go.sum }
      - name: gofmt
        working-directory: apps/gateway
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then echo "gofmt needs to be run on:"; echo "$fmt_out"; exit 1; fi
      - name: Lint Helm chart
        run: |
          # Install helm rather than skipping when it is missing: a missing helm must
          # fail this check, not mask it. The chart must lint cleanly with the
          # backing-service deploy toggles false (the default).
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o get-helm-3
          chmod +x get-helm-3
          ./get-helm-3
          helm version
          # Helm requires every declared dependency to be resolvable before it lints,
          # even ones whose condition is false, so materialise them first.
          helm dependency update deploy/helm/ubag
          helm lint deploy/helm/ubag
          helm template deploy/helm/ubag > /dev/null
          helm template deploy/helm/ubag -f deploy/helm/ubag/values-ha.yaml > /dev/null
      - name: Check goreleaser config
        run: |
          # Installed from the release tarball rather than goreleaser.com/install.sh:
          # that script started returning 404 (the domain now serves docs only).
          curl -fsSL -o goreleaser.tgz \
            https://github.com/goreleaser/goreleaser/releases/download/v2.5.1/goreleaser_Linux_x86_64.tar.gz
          tar -xzf goreleaser.tgz goreleaser
          mv goreleaser /usr/local/bin/goreleaser
          goreleaser check

  typecheck:
    name: Typecheck & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (TypeScript packages, dashboard, mobile)
        run: pnpm typecheck
      - name: Generate contract manifest and build SDK
        run: |
          node tools/make-sdks/generate-manifest.mjs
          pnpm --filter @ubag/sdk build
      - name: Build dashboard
        run: pnpm dashboard:build
      - name: Build docs (astro check)
        run: pnpm docs:build

  go:
    name: Go vet & build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apps/gateway, deploy/operator, packages/sdk-go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: "${{ matrix.module }}/go.mod" }
      - name: go vet
        working-directory: ${{ matrix.module }}
        env: { GOTOOLCHAIN: local }
        run: go vet ./...
      - name: go build
        working-directory: ${{ matrix.module }}
        env: { GOTOOLCHAIN: local }
        run: go build ./...

  worker:
    name: Worker lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: ruff
        run: python -m pip install "ruff==0.8.4" && ruff check apps/worker adapters

  sidecar-rust:
    name: Sidecar (Rust) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        working-directory: packages/sidecar-rust
        run: cargo check --all-features

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # gitleaks-action v2 hard-requires a paid licence secret, so run the OSS
      # binary from its official image instead.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --verbose
