# UBAG continuous integration (blueprint §0 Phase 0, §32 testing strategy).
# Lints, tests, scans, and builds every push and pull request. The jobs mirror
# the canonical local validation commands in package.json so "green in CI"
# matches "green on a contributor's machine".
name: ci

on:
  # perf/** is included because perf/latency-az deploys straight to prod via
  # gateway-image.yml; without it, prod-bound commits were never linted or tested.
  push:
    branches: [main, "feat/**", "release/**", "perf/**"]
  pull_request:
    branches: [main]

# One in-flight run per ref; new pushes cancel stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "10.33.2"
  GO_VERSION: "1.26.x"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint & contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: actions/setup-go@v7
        with: { go-version-file: apps/gateway/go.mod, cache-dependency-path: apps/gateway/go.sum }
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI / JSON-Schema / proto contracts
        run: pnpm test:schema
      - name: Blueprint coverage & REST contracts
        run: pnpm check:blueprint && pnpm check:contracts
      - name: SDK freshness (generated contracts in sync)
        run: pnpm check:sdk-freshness
      - name: gofmt
        working-directory: apps/gateway
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then echo "gofmt needs to be run on:"; echo "$fmt_out"; exit 1; fi
      - name: go vet
        working-directory: apps/gateway
        env: { GOTOOLCHAIN: local }
        run: go vet ./...
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Chaos experiment schema validation
        run: |
          pip install pytest
          python -m pytest tests/chaos/tests/test_schema.py -v
      # Phase 8: deployment infrastructure validation
      - name: Validate nginx-dashboard config
        run: node tools/check-nginx-dashboard.mjs
      - name: Lint Helm chart
        run: |
          # Install helm rather than skipping when it is missing: the
          # `|| echo "helm not installed, skipping"` mask meant this check could
          # never fail, and the chart's own comments state it must lint cleanly
          # with the backing-service deploy toggles false (the default), so a
          # failure here is a real regression.
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o get-helm-3
          chmod +x get-helm-3
          ./get-helm-3
          helm version
          # The chart declares four OPTIONAL in-cluster backing-service subcharts
          # (postgresql, nats, minio, dragonfly) behind *.deploy toggles. Helm
          # still requires every declared dependency to be resolvable before it
          # will lint, even one whose condition is false, so the deps have to be
          # materialised first. `dependency update` (not `build`) because there
          # is no committed Chart.lock to build from. Rendering afterwards proves
          # the default - all toggles false - still needs none of them.
          helm dependency update deploy/helm/ubag
          helm lint deploy/helm/ubag
          helm template deploy/helm/ubag > /dev/null
          helm template deploy/helm/ubag -f deploy/helm/ubag/values-ha.yaml > /dev/null
      - name: Validate Terraform modules
        run: node tools/check-enterprise-deploy.mjs
      - name: Check goreleaser config
        run: |
          # Installed from the release tarball rather than goreleaser.com/install.sh:
          # that script started returning 404 (the domain now serves docs only).
          curl -fsSL -o goreleaser.tgz \
            https://github.com/goreleaser/goreleaser/releases/download/v2.5.1/goreleaser_Linux_x86_64.tar.gz
          tar -xzf goreleaser.tgz goreleaser
          mv goreleaser /usr/local/bin/goreleaser
          goreleaser check
      - name: Validate GitOps manifests
        run: node tools/check-gitops.mjs
      - name: Validate installers
        run: node tools/check-installers.mjs
      # Gates the provider-refresh skill depends on — previously invoked by
      # nothing in CI (the audit found both unwired).
      - name: Provider selector + alert-metric gates
        run: pnpm check:provider-selectors && pnpm check:alert-metrics
      - name: Weight budgets (gating)
        run: node tools/check-weight.mjs --strict
      - name: Multi-region validator
        run: node tools/check-multiregion.mjs

  operator:
    name: Operator (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: deploy/operator/go.mod
      - name: Build operator
        run: cd deploy/operator && go build ./...
      - name: Test operator
        run: cd deploy/operator && go test ./...

  gateway:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    # Real service containers: 17 Postgres + 2 NATS + 1 MinIO tests in the
    # tree skip silently without these, leaving every persistent store
    # production uses untested. The DSNs below match the env names those
    # tests read (UBAG_TEST_POSTGRES_DSN / UBAG_TEST_NATS_URL /
    # UBAG_TEST_MINIO_ENDPOINT). The MinIO container was removed: quay.io/minio
      # now requires authenticated pulls, so the one MinIO test stays skipped
      # until an accessible image source is pinned (follow-up).
    services:
      postgres:
        # pgvector build: migration 0008's blueprint schema requires the
        # vector extension, which plain postgres:16 does not ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ubag
          POSTGRES_PASSWORD: ubag-test
          POSTGRES_DB: ubag_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ubag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: apps/gateway/go.mod, cache-dependency-path: apps/gateway/go.sum }
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats-js -p 4222:4222 nats:2.10-alpine -js
          for i in $(seq 1 20); do
            docker exec nats-js nats-server --help >/dev/null 2>&1 && docker logs nats-js 2>&1 | grep -q "Server is ready" && break
            sleep 1
          done
      - name: Apply Postgres migrations
        env:
          UBAG_TEST_POSTGRES_DSN: postgres://ubag:ubag-test@localhost:5432/ubag_test?sslmode=disable
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          # 0008 needs pgvector + pg_partman (not-yet-wired Phase 2 schema);
          # the production entrypoint skips it via OPTIONAL_MIGRATIONS — same here.
          for f in migrations/postgres/*.sql; do
            case "$f" in *0008_blueprint_schema.sql) continue;; esac
            psql "$UBAG_TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: go test ./...
        working-directory: apps/gateway
        env:
          GOTOOLCHAIN: local
          UBAG_TEST_POSTGRES_DSN: postgres://ubag:ubag-test@localhost:5432/ubag_test?sslmode=disable
          UBAG_TEST_NATS_URL: nats://localhost:4222
        run: |
          set +e
          go test -race -coverprofile=coverage.out ./... 2>&1 | tee /tmp/gotest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Surface the failing output as check-run annotations: the full job
            # log is auth-gated, annotations are readable from any public tooling.
            tail -n 45 /tmp/gotest.log | awk '{ printf "::error title=gotest::%s\n", $0 }'
            exit 1
          fi
          echo "go test clean"
      - name: Postgres round-trip tests (migrations applied)
        working-directory: apps/gateway
        env:
          GOTOOLCHAIN: local
          UBAG_TEST_POSTGRES_DSN: postgres://ubag:ubag-test@localhost:5432/ubag_test?sslmode=disable
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          cd ../.. && node tools/run-postgres-roundtrip-tests.mjs --apply-migrations
      - name: Coverage summary + gate
        working-directory: apps/gateway
        run: |
          go tool cover -func=coverage.out | tee /tmp/coverage-summary.txt | tail -1
          TOTAL=$(grep '^total:' /tmp/coverage-summary.txt | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          # Current gate: 50% (baseline). Long-term target: 80% — see ADR-0014.
          awk -v cov="$TOTAL" 'BEGIN { if (cov+0 < 50) { print "Coverage " cov "% is below 50% gate"; exit 1 } }'
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: gateway-coverage
          path: apps/gateway/coverage.out
      - name: Phase 9 packages (region, mfa, jitadmin, audit, siem)
        working-directory: apps/gateway
        run: go test -race ./internal/region/... ./internal/mfa/... ./internal/jitadmin/... ./internal/audit/... ./internal/siem/...

  worker:
    name: Worker (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install worker (offline/mock test mode)
        run: python -m pip install --upgrade pip && python -m pip install -e "apps/worker[dev]" || python -m pip install -e apps/worker
      - name: ruff
        run: python -m pip install "ruff==0.8.4" && ruff check apps/worker adapters
      - name: pytest (UBAG_ADAPTER_OFFLINE=1)
        env: { UBAG_ADAPTER_OFFLINE: "1" }
        run: node tools/run-python-worker-tests.mjs
      - name: Worker region pinning tests
        env: { UBAG_ADAPTER_OFFLINE: "1" }
        run: python -m pytest apps/worker/tests/test_region.py -v

  node-suite:
    name: Node packages, SDKs, dashboard, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: actions/setup-go@v7
        with: { go-version-file: apps/gateway/go.mod, cache-dependency-path: apps/gateway/go.sum }
      - run: pnpm install --frozen-lockfile
      - name: Edge store, plugins, adapter-registry, security, sidecar
        run: pnpm test:edge-store && pnpm test:plugins && pnpm test:adapter-registry && pnpm test:security && pnpm test:sidecar
      - name: SDK suite (TypeScript + Go)
        run: pnpm test:sdk
      - name: Conformance + observability
        run: pnpm test:conformance && pnpm test:observability
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/dashboard/package.json', 'pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        working-directory: apps/dashboard
        run: npx playwright install chromium --with-deps || npx playwright install chromium
      - name: CLI, dashboard, docs
        # The dashboard e2e webServer must be serve-dashboard.mjs (same-origin
        # /v1 proxy), not vite preview: under vite preview the SPA fallback
        # answers /v1/* and the Playwright endpoint mocks race the page's own
        # first fetch, which left the Antigravity tests stuck on their loading
        # state. UBAG_PLAYWRIGHT_PREVIEW_PORT switches playwright.config.ts to
        # serve-dashboard with a dead gateway URL — the same deterministic
        # setup used locally.
        env: { UBAG_PLAYWRIGHT_PREVIEW_PORT: "5899" }
        run: pnpm test:cli && pnpm test:dashboard && pnpm test:docs
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Cookbook recipe count check
        run: node tools/check-cookbook.mjs
      - name: License posture check
        run: node tools/check-licenses.mjs
      - name: API reference freshness check
        run: node tools/check-api-reference.mjs
      # Phase 6: metrics cardinality + Grafana dashboard validation
      - name: Check Grafana dashboards (Task 2.5)
        run: node tools/check-grafana-dashboards.mjs deploy/grafana/dashboards/
      - name: Verify committed .wasm fixtures present (Task 1.7)
        run: |
          test -f apps/gateway/internal/plugins/testdata/echo_transform.wasm || (echo "echo_transform.wasm missing" && exit 1)
          test -f apps/gateway/internal/plugins/testdata/infinite_loop.wasm || (echo "infinite_loop.wasm missing" && exit 1)
          echo "WASM fixtures: OK"

  security-scan:
    name: Supply-chain & vuln scan
    runs-on: ubuntu-latest
    # The workflow-level default is contents: read. gitleaks-action uploads a
    # SARIF report to the code-scanning API, which needs security-events: write;
    # without this scope the job fails before any step runs ("Set up job").
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        # GO_VERSION, not the go.mod pin: govulncheck@latest needs go >= 1.26
        # and GOTOOLCHAIN=local forbids the upgrade.
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: apps/gateway/go.sum }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}" }

      # Secret scanning. The repo builds its image with `context: .`, so any
      # credential committed to the tree - including one that reached a job
      # payload - would be uploaded to a hosted runner on the next build.
      # gitleaks-action v2 now hard-requires a paid GITLEAKS_LICENSE secret,
      # so run the OSS binary directly from its official image instead.
      - name: gitleaks (secret scan)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --verbose

      # These previously ran with `|| true`, so they could never fail a build
      # and the scan was advisory decoration only.
      - name: govulncheck
        working-directory: apps/gateway
        # GO_VERSION (1.26.x) not go.mod: latest govulncheck requires go >= 1.26
        # to build, and GOTOOLCHAIN=local forbids the auto-upgrade.
        env: { GOTOOLCHAIN: local }
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          echo "govulncheck clean"

      # pip-audit pointed at apps/worker/requirements.txt, which does not exist -
      # the worker declares dependencies in pyproject.toml - so the audit was a
      # permanent no-op. Read the real dependency set instead.
      - name: pip-audit (worker)
        run: |
          pip install --quiet pip-audit
          python - <<'PY' > /tmp/worker-requirements.txt
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("apps/worker/pyproject.toml").read_text())
          deps = list(data["project"].get("dependencies", []))
          for extra in data["project"].get("optional-dependencies", {}).values():
              deps.extend(extra)
          print("\n".join(deps))
          PY
          cat /tmp/worker-requirements.txt
          pip-audit --strict -r /tmp/worker-requirements.txt

      - name: pnpm audit (regression-gated)
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          # NOT a raw `pnpm audit` gate. There are 48 open advisories and pnpm
          # reports no patched version for any of them; all of them are build
          # tooling (vite, postcss, browserslist, nanoid, vitest, the
          # astro/starlight docs toolchain), none of which ships - the gateway
          # is a Go binary and apps/dashboard deploys static files. A gate that
          # can never go green gets bypassed, which is how this repo ended up
          # with no npm audit at all. This fails on any INCREASE against the
          # committed baseline in tools/audit-baseline.json, so a new vulnerable
          # dependency breaks the build while the known backlog stays tracked.
          node tools/check-npm-audit.mjs

      - name: cargo audit (Rust sidecar)
        working-directory: packages/sidecar-rust
        run: |
          cargo install cargo-audit --locked
          # Cargo.lock is gitignored in this package, so the dependency tree has
          # to be resolved before cargo audit will run at all (it errors with
          # "could not find Cargo.lock"). Not committing the lockfile also means
          # sidecar builds are not reproducible - see the note in PROGRESS.md.
          cargo generate-lockfile
          cargo audit

      # The production image. It is the artifact gateway-image.yml ships, and it
      # was previously never scanned.
      - name: Build gateway image
        run: docker build -t ubag/gateway:ci-scan -f deploy/small/gateway.Dockerfile .
      - name: Trivy image scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ubag/gateway:ci-scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: IaC scan (Terraform / Compose / Helm)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Our own IaC is what this gate judges; dependency trees carry
          # third-party Dockerfiles (e.g. yaml-language-server) whose
          # findings are upstream's to fix, not ours.
          skip-dirs: node_modules,dist,.svelte-kit,vendor

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with: { format: spdx-json, output-file: ubag.sbom.spdx.json }
      - uses: actions/upload-artifact@v7
        with: { name: sbom, path: ubag.sbom.spdx.json }

  dependency-review:
    name: Dependency review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # Blocks a PR that introduces a dependency with a known CVE or an
      # AGPL/copyleft licence. Dependabot version bumps existed, but nothing
      # gated what a PR was allowed to pull in.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  sidecar-rust:
    name: Sidecar (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test Rust sidecar
        working-directory: packages/sidecar-rust
        run: cargo test --all-features

  sso-integration:
    name: SSO integration (Keycloak)
    runs-on: ubuntu-latest
    if: ${{ vars.UBAG_TEST_SSO == '1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: apps/gateway/go.mod, cache-dependency-path: apps/gateway/go.sum }
      - name: Start Keycloak
        run: docker compose -f apps/gateway/tests/sso/docker-compose.yml up -d keycloak
      - name: Wait for Keycloak
        run: |
          until curl -sf http://localhost:8180/health/ready; do sleep 2; done
      - name: SSO integration tests
        working-directory: apps/gateway
        env: { UBAG_TEST_SSO: "1" }
        run: go test -tags integration ./tests/sso/... -v -timeout 120s

  itest:
    name: Integration tests (gateway + worker + DB)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Build gateway image
        run: docker build -t ubag/gateway:small-local -f deploy/small/gateway.Dockerfile .
      - name: Run integration tests
        run: node tools/run-integration-tests.mjs
        env:
          UBAG_ITEST_TIMEOUT: "30000"
