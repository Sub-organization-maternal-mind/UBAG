name: Helper Image

# Builds the Helper Node image (deploy/helper/Dockerfile) for the external fleet
# manager to pull. MANUAL ONLY: no push, pull_request or schedule trigger, so
# nothing builds or publishes unless an operator dispatches it. The image is
# inert; the manager applies limits and firewall rules and starts it from
# deploy/helper/workload-manifest.json.
on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the image to GHCR (default: build only, to prove it builds)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: helper-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Helper deploy artifacts
        run: node tools/check-helper-deploy.mjs

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push when requested)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/helper/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push }}
          build-args: |
            UBAG_HELPER_VERSION=sha-${{ github.sha }}
          # Only the immutable sha tag: the manifest names it through {{image_tag}}.
          tags: ghcr.io/sub-organization-maternal-mind/ubag-helper:sha-${{ github.sha }}
          cache-from: type=gha,scope=ubag-helper
          cache-to: type=gha,scope=ubag-helper,mode=max

      - name: Summarize
        run: |
          echo "### Helper image ${{ inputs.push && 'pushed' || 'built (not pushed)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/sub-organization-maternal-mind/ubag-helper:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
