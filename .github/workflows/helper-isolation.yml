name: Helper Isolation

# Helper isolation acceptance (perf-fleet P7.3). MANUAL ONLY: no push, pull_request
# or schedule trigger, so nothing runs unless an operator dispatches it. It touches
# no production host and no secret: the certificates are throwaway files generated
# inside the job, the helpers are containers on a private Docker network and the
# "primary" is the Go test process on the runner.
#
#   go-isolation  the in-process isolation suites (real helper services over real
#                 mTLS, 1/2/5/10/20 workloads) and the env-dump scan, on Linux.
#   containers    the same properties against TWO containerised helpers built from
#                 deploy/helper/Dockerfile: mTLS dial from the primary, cross-tenant
#                 and duplicate-result checks at 1/2/5/10 workloads (two helpers hold
#                 16 attempts, so 20 needs a third), an environment scan of every
#                 process in each container, and refusal to start with a primary
#                 secret in the environment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: apps/gateway/go.mod, cache-dependency-path: apps/gateway/go.sum }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Isolation suites (in-process helpers over real mTLS)
        working-directory: apps/gateway
        run: go test -race -count=1 -run 'TestIsolation' ./internal/helperclient/ ./internal/helper/runner/
      - name: Isolation consistency checks (Python)
        run: |
          pip install pytest
          python -m pytest tests/chaos/tests/test_helper_isolation.py -v

  containers:
    needs: go-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIXTURES: ${{ github.workspace }}/.isolation-fixtures
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: apps/gateway/go.mod, cache-dependency-path: apps/gateway/go.sum }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Build the helper image
        run: docker build -f deploy/helper/Dockerfile --build-arg UBAG_HELPER_VERSION=isolation -t ubag-helper:isolation .

      - name: Issue throwaway certificates (CI only, valid 48 h, never committed)
        working-directory: apps/gateway
        run: UBAG_ISOLATION_WRITE_FIXTURES="$FIXTURES" go test -count=1 -run TestIsolationWriteFixtures ./internal/helperclient/

      - name: Start two helper containers on a private network
        run: |
          set -euo pipefail
          docker network create --subnet 172.30.0.0/24 ubag-iso
          docker run -d --name ubag-iso-a --network ubag-iso --ip 172.30.0.11 \
            --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --shm-size 1g \
            --tmpfs /var/lib/ubag-helper/home:uid=10001,gid=10001 --tmpfs /tmp \
            --mount type=volume,src=ubag-iso-a-profiles,dst=/var/lib/ubag-helper/profiles \
            -v "$FIXTURES/iso-a:/etc/ubag-helper/tls:ro" \
            -e UBAG_HELPER_LISTEN=172.30.0.11:7443 -e UBAG_HELPER_NODE_ID=iso-a \
            -e UBAG_HELPER_CA_FILE=/etc/ubag-helper/tls/ca.pem \
            -e UBAG_HELPER_TLS_CERT_FILE=/etc/ubag-helper/tls/node.crt \
            -e UBAG_HELPER_TLS_KEY_FILE=/etc/ubag-helper/tls/node.key \
            -e UBAG_HELPER_PRIMARY_URI_SAN=spiffe://ubag/primary/primary-iso \
            -e UBAG_HELPER_WORKLOAD_VERSION=isolation -e UBAG_HELPER_MAX_ATTEMPTS=8 \
            ubag-helper:isolation
          docker run -d --name ubag-iso-b --network ubag-iso --ip 172.30.0.12 \
            --user 10001:10001 --read-only --cap-drop ALL --security-opt no-new-privileges --shm-size 1g \
            --tmpfs /var/lib/ubag-helper/home:uid=10001,gid=10001 --tmpfs /tmp \
            --mount type=volume,src=ubag-iso-b-profiles,dst=/var/lib/ubag-helper/profiles \
            -v "$FIXTURES/iso-b:/etc/ubag-helper/tls:ro" \
            -e UBAG_HELPER_LISTEN=172.30.0.12:7443 -e UBAG_HELPER_NODE_ID=iso-b \
            -e UBAG_HELPER_CA_FILE=/etc/ubag-helper/tls/ca.pem \
            -e UBAG_HELPER_TLS_CERT_FILE=/etc/ubag-helper/tls/node.crt \
            -e UBAG_HELPER_TLS_KEY_FILE=/etc/ubag-helper/tls/node.key \
            -e UBAG_HELPER_PRIMARY_URI_SAN=spiffe://ubag/primary/primary-iso \
            -e UBAG_HELPER_WORKLOAD_VERSION=isolation -e UBAG_HELPER_MAX_ATTEMPTS=8 \
            ubag-helper:isolation
          for c in ubag-iso-a ubag-iso-b; do
            for _ in $(seq 1 60); do
              if docker logs "$c" 2>&1 | grep -q 'ubag-helper starting'; then break; fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$c")" != "true" ]; then docker logs "$c"; exit 1; fi
              sleep 1
            done
            docker logs "$c" 2>&1 | grep -q 'ubag-helper starting' || { docker logs "$c"; exit 1; }
          done

      - name: Isolation against the two containers (mTLS dial, tenants, duplicates)
        working-directory: apps/gateway
        run: UBAG_ISOLATION_FIXTURES="$FIXTURES" UBAG_ISOLATION_ADAPTERS_DIR="$GITHUB_WORKSPACE/adapters" go test -race -count=1 -v -run TestIsolationOnContainerisedHelpers ./internal/helperclient/

      - name: Environment scan of every process in each container, and refusal with a secret
        run: |
          pip install pytest
          UBAG_CHAOS_HELPER_CONTAINERS=ubag-iso-a,ubag-iso-b UBAG_CHAOS_HELPER_IMAGE=ubag-helper:isolation \
            python -m pytest tests/chaos/tests/test_helper_isolation.py -v

      - name: Helper logs
        if: failure()
        run: |
          docker logs ubag-iso-a 2>&1 | tail -n 100 || true
          docker logs ubag-iso-b 2>&1 | tail -n 100 || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f ubag-iso-a ubag-iso-b || true
          docker network rm ubag-iso || true
          docker volume rm ubag-iso-a-profiles ubag-iso-b-profiles || true
