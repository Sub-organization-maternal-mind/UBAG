name: ubag-small

services:
  gateway:
    build:
      context: .
      dockerfile: deploy/small/gateway.Dockerfile
    image: ${UBAG_GATEWAY_IMAGE:-ubag/gateway:small-local}
    cpus: "3.0"
    mem_limit: 2g
    restart: unless-stopped
    environment:
      UBAG_GATEWAY_ADDR: ":8080"
      GOMAXPROCS: "3"
      GOMEMLIMIT: "1800MiB"
      UBAG_APP_SECRET: ${UBAG_APP_SECRET:?Set UBAG_APP_SECRET in deploy/small/env.local}
      UBAG_API_VERSION: ${UBAG_API_VERSION:-2026-05-22}
      UBAG_GATEWAY_VERSION: ${UBAG_GATEWAY_VERSION:-0.0.0-small}
      UBAG_BUILD_COMMIT: ${UBAG_BUILD_COMMIT:-local}
      UBAG_ACTOR_ROLE: ${UBAG_ACTOR_ROLE:-}
      UBAG_GATEWAY_STORE: ${UBAG_GATEWAY_STORE:-memory}
      UBAG_FACADE_MAX_WAIT_MS: ${UBAG_FACADE_MAX_WAIT_MS:-240000}
      UBAG_POSTGRES_DSN: ${UBAG_POSTGRES_DSN:-}
      # Migrations are fail-closed; 0008_blueprint_schema.sql needs the
      # pgvector + pg_partman extensions so it stays opt-in. See
      # deploy/small/gateway-entrypoint.sh.
      UBAG_ALLOW_OPTIONAL_MIGRATIONS: ${UBAG_ALLOW_OPTIONAL_MIGRATIONS:-0}
      UBAG_IDEMPOTENCY_TTL_HOURS: ${UBAG_IDEMPOTENCY_TTL_HOURS:-24}
      UBAG_DATABASE_MAX_OPEN_CONNS: ${UBAG_DATABASE_MAX_OPEN_CONNS:-10}
      UBAG_DATABASE_MAX_IDLE_CONNS: ${UBAG_DATABASE_MAX_IDLE_CONNS:-5}
      UBAG_DATABASE_CONN_MAX_LIFETIME_SECONDS: ${UBAG_DATABASE_CONN_MAX_LIFETIME_SECONDS:-300}
      UBAG_EXECUTOR_MODE: ${UBAG_EXECUTOR_MODE:-noop}
      UBAG_EXECUTOR_SPOOL_DIR: ${UBAG_EXECUTOR_SPOOL_DIR:-/var/lib/ubag/executor-spool}
      UBAG_NATS_URL: ${UBAG_NATS_URL:-nats://nats:4222}
      UBAG_NATS_STREAM: ${UBAG_NATS_STREAM:-UBAG_JOBS}
      UBAG_NATS_SUBJECT: ${UBAG_NATS_SUBJECT:-ubag.jobs}
      UBAG_NATS_WORKER_DURABLE: ${UBAG_NATS_WORKER_DURABLE:-ubag-worker}
      # Leave empty so the gateway derives ack-wait from UBAG_WORKER_MAX_RUNTIME_MS
      # (+5s). A hardcoded default here silently overrode that and, with a longer
      # worker runtime, would let JetStream redeliver a still-running job and
      # duplicate it. Startup now refuses any ack-wait <= max runtime.
      UBAG_NATS_WORKER_ACK_WAIT_MS: ${UBAG_NATS_WORKER_ACK_WAIT_MS:-}
      UBAG_NATS_WORKER_NAK_DELAY_MS: ${UBAG_NATS_WORKER_NAK_DELAY_MS:-1000}
      UBAG_NATS_WORKER_FETCH_WAIT_MS: ${UBAG_NATS_WORKER_FETCH_WAIT_MS:-500}
      UBAG_NATS_WORKER_MAX_DELIVER: ${UBAG_NATS_WORKER_MAX_DELIVER:-5}
      UBAG_ARTIFACT_STORE: ${UBAG_ARTIFACT_STORE:-memory}
      UBAG_MINIO_ENDPOINT: ${UBAG_MINIO_ENDPOINT:-minio:9000}
      UBAG_MINIO_ACCESS_KEY: ${UBAG_MINIO_ACCESS_KEY:-}
      UBAG_MINIO_SECRET_KEY: ${UBAG_MINIO_SECRET_KEY:-}
      UBAG_MINIO_BUCKET: ${UBAG_MINIO_BUCKET:-ubag-artifacts}
      UBAG_MINIO_USE_SSL: ${UBAG_MINIO_USE_SSL:-false}
      UBAG_WORKER_CONSUMER_ENABLED: ${UBAG_WORKER_CONSUMER_ENABLED:-false}
      # python:3.12-slim (this image's runtime base, deploy/small/gateway.Dockerfile)
      # installs its interpreter under /usr/local/bin, not /usr/bin — confirmed via
      # `docker run --rm --entrypoint sh ubag/gateway:small-local -c "which python3"`.
      UBAG_WORKER_PYTHON: ${UBAG_WORKER_PYTHON:-/usr/local/bin/python3}
      UBAG_WORKER_SCRIPT: ${UBAG_WORKER_SCRIPT:-/app/apps/worker/run_mock_worker.py}
      UBAG_WORKER_POLL_INTERVAL_MS: ${UBAG_WORKER_POLL_INTERVAL_MS:-500}
      UBAG_WORKER_MAX_RUNTIME_MS: ${UBAG_WORKER_MAX_RUNTIME_MS:-120000}
      UBAG_WORKER_CONCURRENCY: ${UBAG_WORKER_CONCURRENCY:-1}
      # Opt-in stale-job reaper: times out jobs stuck non-terminal (crashed
      # worker) and releases their concurrency-lane token. Default MaxLifetime is
      # idle-time since last update — a progressing job is never reaped.
      UBAG_JOB_REAPER_ENABLED: ${UBAG_JOB_REAPER_ENABLED:-false}
      UBAG_JOB_MAX_LIFETIME_SECONDS: ${UBAG_JOB_MAX_LIFETIME_SECONDS:-3600}
      UBAG_JOB_REAPER_INTERVAL_SECONDS: ${UBAG_JOB_REAPER_INTERVAL_SECONDS:-60}
      # Live-browser bridge: when the "live-browser" profile is up, point the
      # worker at the shared Chromium (CDP) so live jobs reuse the user-owned,
      # manually-logged-in profile instead of launching a throwaway browser.
      UBAG_REMOTE_BROWSER_ENDPOINT: ${UBAG_REMOTE_BROWSER_ENDPOINT:-}
      UBAG_BROWSER_HEADED: ${UBAG_BROWSER_HEADED:-false}
      UBAG_BROWSER_ENGINE: ${UBAG_BROWSER_ENGINE:-}
      UBAG_BROWSER_PROTOCOL: ${UBAG_BROWSER_PROTOCOL:-}
      # Loopback noVNC base advertised in session.manual_action_required events.
      # Must stay loopback (gateway redaction only forwards loopback noVNC URLs).
      UBAG_NOVNC_BASE_URL: ${UBAG_NOVNC_BASE_URL:-http://127.0.0.1:7900}
      UBAG_WEBHOOK_OUTBOX: ${UBAG_WEBHOOK_OUTBOX:-}
      UBAG_WEBHOOK_WORKER_ENABLED: ${UBAG_WEBHOOK_WORKER_ENABLED:-false}
      UBAG_WEBHOOK_SECRET: ${UBAG_WEBHOOK_SECRET:-}
      UBAG_WEBHOOK_SECRET_ENV_PREFIX: ${UBAG_WEBHOOK_SECRET_ENV_PREFIX:-UBAG_WEBHOOK_SECRET_}
      UBAG_WEBHOOK_MAX_ATTEMPTS: ${UBAG_WEBHOOK_MAX_ATTEMPTS:-8}
      UBAG_WEBHOOK_POLL_INTERVAL_MS: ${UBAG_WEBHOOK_POLL_INTERVAL_MS:-1000}
      UBAG_WEBHOOK_BATCH_SIZE: ${UBAG_WEBHOOK_BATCH_SIZE:-10}
      UBAG_WEBHOOK_LEASE_MS: ${UBAG_WEBHOOK_LEASE_MS:-30000}
      UBAG_WEBHOOK_REQUEST_TIMEOUT_MS: ${UBAG_WEBHOOK_REQUEST_TIMEOUT_MS:-10000}
      UBAG_WEBHOOK_RETRY_BASE_MS: ${UBAG_WEBHOOK_RETRY_BASE_MS:-1000}
      UBAG_WEBHOOK_RETRY_MAX_MS: ${UBAG_WEBHOOK_RETRY_MAX_MS:-300000}
      UBAG_WEBHOOK_MAX_RESPONSE_BYTES: ${UBAG_WEBHOOK_MAX_RESPONSE_BYTES:-8192}
      UBAG_WEBHOOK_WORKER_ID: ${UBAG_WEBHOOK_WORKER_ID:-gateway-webhook-worker}
      UBAG_WEBHOOK_ALLOW_INSECURE_HTTP: ${UBAG_WEBHOOK_ALLOW_INSECURE_HTTP:-false}
      UBAG_WEBHOOK_ALLOW_PRIVATE_HOSTS: ${UBAG_WEBHOOK_ALLOW_PRIVATE_HOSTS:-false}
      UBAG_WEBHOOK_ALLOWED_HOSTS: ${UBAG_WEBHOOK_ALLOWED_HOSTS:-}
      UBAG_WEBHOOK_ALLOW_ANY_PUBLIC_HOST: ${UBAG_WEBHOOK_ALLOW_ANY_PUBLIC_HOST:-false}
      # Browser origins allowed on /v1/voice/* (comma list of exact origins,
      # e.g. https://app.example.com). Empty = same-origin only; "*" is never
      # honoured. Server-to-server clients send no Origin and are unaffected.
      UBAG_ALLOWED_ORIGINS: ${UBAG_ALLOWED_ORIGINS:-}
      # Overload / admission limits. Empty keeps the gateway's built-in defaults
      # (0 = unlimited for the admission lanes).
      UBAG_ADMISSION_SHARED: ${UBAG_ADMISSION_SHARED:-true}
      UBAG_ADMISSION_MAX_INFLIGHT_PER_APP: ${UBAG_ADMISSION_MAX_INFLIGHT_PER_APP:-}
      UBAG_ADMISSION_MAX_INFLIGHT_PER_TENANT: ${UBAG_ADMISSION_MAX_INFLIGHT_PER_TENANT:-}
      UBAG_ADMISSION_MAX_INFLIGHT_GLOBAL: ${UBAG_ADMISSION_MAX_INFLIGHT_GLOBAL:-}
      UBAG_GATEWAY_MAX_INFLIGHT_REQUESTS: ${UBAG_GATEWAY_MAX_INFLIGHT_REQUESTS:-}
      UBAG_GATEWAY_UPLOAD_MEMORY_BYTES: ${UBAG_GATEWAY_UPLOAD_MEMORY_BYTES:-}
      UBAG_FACADE_MAX_BODY_BYTES: ${UBAG_FACADE_MAX_BODY_BYTES:-}
      # ── Voice (read by the GATEWAY and by the worker it spawns) ────────────
      # The session store follows the gateway store by default so voice always
      # shares the same durable store (postgres here) instead of a private
      # in-memory copy. Voice stays inert until UBAG_VOICE_AUDIO_ENABLED=1 on
      # the live-browser profile turns the browser's audio stack on.
      UBAG_VOICE_STORE: ${UBAG_VOICE_STORE:-${UBAG_GATEWAY_STORE:-memory}}
      UBAG_VOICE_RECONCILER_FAIL_CLOSED: ${UBAG_VOICE_RECONCILER_FAIL_CLOSED:-}
      UBAG_VOICE_AUDIO_RELAY_ADDR: ${UBAG_VOICE_AUDIO_RELAY_ADDR:-browser-viewer:9099}
      UBAG_VOICE_MAX_SESSIONS_PER_TENANT: ${UBAG_VOICE_MAX_SESSIONS_PER_TENANT:-4}
      UBAG_VOICE_MAX_QUEUED_PER_TENANT: ${UBAG_VOICE_MAX_QUEUED_PER_TENANT:-32}
      UBAG_VOICE_SESSION_TTL_SECONDS: ${UBAG_VOICE_SESSION_TTL_SECONDS:-600}
      UBAG_VOICE_PROVIDER_ACTIVATION: ${UBAG_VOICE_PROVIDER_ACTIVATION:-1}
      # Shared secret authenticating media sessions to the browser audio relay
      # (same value as on browser-viewer; the relay refuses every session when
      # it is empty). Generate with: openssl rand -hex 32
      UBAG_VOICE_RELAY_SECRET: ${UBAG_VOICE_RELAY_SECRET:-}
      # The worker is embedded in this container, so its voice-job CDP host
      # allowlist lives here. Voice jobs fail closed when it is empty.
      UBAG_VOICE_CDP_ALLOWED_HOSTS: ${UBAG_VOICE_CDP_ALLOWED_HOSTS:-${UBAG_BROWSER_PRIVATE_IP:-172.31.0.5},browser-viewer}
      # NAT traversal (all optional; see deploy/small/README.md "Remote/HTTPS +
      # voice"). The media UDP range is only PUBLISHED by the opt-in overlay
      # deploy/small/compose.voice-media.yml.
      UBAG_VOICE_STUN_URLS: ${UBAG_VOICE_STUN_URLS:-}
      UBAG_VOICE_TURN_URLS: ${UBAG_VOICE_TURN_URLS:-}
      UBAG_VOICE_TURN_SECRET: ${UBAG_VOICE_TURN_SECRET:-}
      UBAG_VOICE_NAT_1TO1_IP: ${UBAG_VOICE_NAT_1TO1_IP:-}
      UBAG_VOICE_MEDIA_PORT_MIN: ${UBAG_VOICE_MEDIA_PORT_MIN:-}
      UBAG_VOICE_MEDIA_PORT_MAX: ${UBAG_VOICE_MEDIA_PORT_MAX:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${UBAG_BACKING_BIND_HOST:-127.0.0.1}:${UBAG_GATEWAY_PORT:-8080}:8080"
    volumes:
      - executor_spool:/var/lib/ubag/executor-spool
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ubag-private

  nginx-dashboard:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      # Gateway secret injected server-side into /v1/* Authorization headers.
      # Never sent to the browser. Sourced from UBAG_APP_SECRET.
      UBAG_GATEWAY_SECRET: ${UBAG_APP_SECRET:?Set UBAG_APP_SECRET in deploy/small/env.local}
      # Restrict envsubst to UBAG_ vars so nginx $host/$uri/etc. are left intact.
      NGINX_ENVSUBST_FILTER: "UBAG_"
    ports:
      - "${UBAG_EDGE_BIND_HOST:-127.0.0.1}:${UBAG_NGINX_HTTP_PORT:-8083}:80"
    volumes:
      - "./deploy/small/nginx-dashboard/default.conf.template:/etc/nginx/templates/default.conf.template:ro"
      - "./deploy/small/nginx-dashboard/.htpasswd:/etc/nginx/.htpasswd:ro"
      - "./apps/dashboard/dist:/srv/dashboard:ro"
    networks:
      - ubag-public
      - ubag-private
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Authenticated-HTTPS edge (opt-in: --profile tls). Stock caddy:2 image, no
  # custom build: automatic HTTPS for UBAG_PUBLIC_DOMAIN, /v1/* proxied to the
  # gateway, which authenticates the caller's own bearer token (Caddy never
  # injects or stores a token). Only 80/443 are published. noVNC, CDP, the audio
  # relay and the operator dashboard are NOT routed here. See deploy/small/caddy/Caddyfile.
  caddy:
    image: ${UBAG_CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    profiles: ["tls"]
    mem_limit: 256m
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      UBAG_PUBLIC_DOMAIN: ${UBAG_PUBLIC_DOMAIN:-}
      UBAG_FACADE_MAX_BODY_BYTES: ${UBAG_FACADE_MAX_BODY_BYTES:-50331648}
    ports:
      - "${UBAG_TLS_BIND_HOST:-0.0.0.0}:${UBAG_TLS_HTTP_PORT:-80}:80"
      - "${UBAG_TLS_BIND_HOST:-0.0.0.0}:${UBAG_TLS_HTTPS_PORT:-443}:443"
    volumes:
      - "./deploy/small/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ubag-public
      - ubag-private

  # Optional TURN relay for voice clients behind restrictive NAT (opt-in:
  # --profile turn). Time-limited credentials only (use-auth-secret): the
  # gateway derives them from UBAG_VOICE_TURN_SECRET, which must be the same
  # value here. Static options live in deploy/small/coturn/turnserver.conf; the
  # secret, realm and addresses come from env (never written to a file). The
  # relay port range is bounded and published; peers inside private ranges are
  # denied except the gateway media address. Requires UBAG_VOICE_NAT_1TO1_IP.
  coturn:
    image: ${UBAG_COTURN_IMAGE:-coturn/coturn:4.6.3}
    restart: unless-stopped
    profiles: ["turn"]
    mem_limit: 256m
    environment:
      UBAG_VOICE_TURN_SECRET: ${UBAG_VOICE_TURN_SECRET:-}
      UBAG_PUBLIC_DOMAIN: ${UBAG_PUBLIC_DOMAIN:-}
      UBAG_VOICE_NAT_1TO1_IP: ${UBAG_VOICE_NAT_1TO1_IP:-}
      UBAG_TURN_EXTERNAL_IP: ${UBAG_TURN_EXTERNAL_IP:-}
      UBAG_TURN_RELAY_PORT_MIN: ${UBAG_TURN_RELAY_PORT_MIN:-49160}
      UBAG_TURN_RELAY_PORT_MAX: ${UBAG_TURN_RELAY_PORT_MAX:-49199}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${UBAG_VOICE_TURN_SECRET:?set UBAG_VOICE_TURN_SECRET (same value as the gateway)}"
        : "$${UBAG_PUBLIC_DOMAIN:?set UBAG_PUBLIC_DOMAIN (TURN realm)}"
        : "$${UBAG_VOICE_NAT_1TO1_IP:?set UBAG_VOICE_NAT_1TO1_IP (the gateway media address)}"
        exec turnserver -c /etc/coturn/turnserver.conf \
          --static-auth-secret="$${UBAG_VOICE_TURN_SECRET}" \
          --realm="$${UBAG_PUBLIC_DOMAIN}" \
          --external-ip="$${UBAG_TURN_EXTERNAL_IP:-$${UBAG_VOICE_NAT_1TO1_IP}}" \
          --allowed-peer-ip="$${UBAG_VOICE_NAT_1TO1_IP}" \
          --min-port="$${UBAG_TURN_RELAY_PORT_MIN}" \
          --max-port="$${UBAG_TURN_RELAY_PORT_MAX}"
    ports:
      - "${UBAG_TURN_BIND_HOST:-0.0.0.0}:${UBAG_TURN_PORT:-3478}:3478/udp"
      - "${UBAG_TURN_BIND_HOST:-0.0.0.0}:${UBAG_TURN_PORT:-3478}:3478/tcp"
      - "${UBAG_TURN_BIND_HOST:-0.0.0.0}:${UBAG_TURN_RELAY_PORT_MIN:-49160}-${UBAG_TURN_RELAY_PORT_MAX:-49199}:${UBAG_TURN_RELAY_PORT_MIN:-49160}-${UBAG_TURN_RELAY_PORT_MAX:-49199}/udp"
    volumes:
      - "./deploy/small/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro"
    networks:
      - ubag-public

  # Live-browser viewer: real persistent Chromium on a virtual display, streamed
  # to the operator over noVNC for ToS-safe MANUAL login (no credential capture,
  # no CAPTCHA bypass). The worker attaches to this Chromium over CDP so live
  # jobs reuse the user-owned, already-logged-in profile. Opt-in via the
  # "live-browser" profile; noVNC is published to loopback and password-gated.
  browser-viewer:
    build:
      context: .
      dockerfile: deploy/small/browser-viewer/Dockerfile
    image: ${UBAG_BROWSER_VIEWER_IMAGE:-ubag/browser-viewer:small-local}
    cpus: "1.5"
    mem_limit: 3g
    restart: unless-stopped
    profiles: ["live-browser"]
    environment:
      UBAG_BROWSER_DISPLAY: ${UBAG_BROWSER_DISPLAY:-:99}
      UBAG_BROWSER_GEOMETRY: ${UBAG_BROWSER_GEOMETRY:-1280x800x24}
      UBAG_BROWSER_PROFILE_DIR: ${UBAG_BROWSER_PROFILE_DIR:-/profiles/default}
      UBAG_BROWSER_CDP_PORT: ${UBAG_BROWSER_CDP_PORT:-9222}
      UBAG_BROWSER_CDP_PROXY_PORT: ${UBAG_BROWSER_CDP_PROXY_PORT:-9223}
      UBAG_BROWSER_VNC_PORT: ${UBAG_BROWSER_VNC_PORT:-5900}
      UBAG_BROWSER_NOVNC_PORT: ${UBAG_BROWSER_NOVNC_PORT:-6080}
      UBAG_BROWSER_START_URL: ${UBAG_BROWSER_START_URL:-about:blank}
      # Voice audio stack (opt-in via env.local): PulseAudio + the audio relay
      # (port 9099, internal only, never published). The gateway-side voice
      # settings live on the gateway service. Inert until
      # UBAG_VOICE_AUDIO_ENABLED=1; the relay refuses all sessions without a
      # UBAG_VOICE_RELAY_SECRET (same value as on the gateway).
      UBAG_VOICE_AUDIO_ENABLED: ${UBAG_VOICE_AUDIO_ENABLED:-0}
      UBAG_VOICE_RELAY_ADDR: ${UBAG_VOICE_RELAY_ADDR:-0.0.0.0:9099}
      UBAG_VOICE_RELAY_SECRET: ${UBAG_VOICE_RELAY_SECRET:-}
      # Opt-in relay measurement: a JSON stats line every 10 s in /run/ubag/audio-relay.log.
      UBAG_VOICE_RELAY_STATS: ${UBAG_VOICE_RELAY_STATS:-0}
      UBAG_BROWSER_VNC_PASSWORD: ${UBAG_BROWSER_VNC_PASSWORD:?Set UBAG_BROWSER_VNC_PASSWORD in deploy/small/env.local}
    ports:
      # noVNC published to loopback only (matches the worker's loopback noVNC URL
      # at http://127.0.0.1:7900/session/...). CDP and the voice relay stay
      # internal — never bound.
      - "${UBAG_BACKING_BIND_HOST:-127.0.0.1}:${UBAG_NOVNC_PORT:-7900}:6080"
    volumes:
      - browser_profiles:/profiles
    networks:
      ubag-public:
      ubag-private:
        # Chrome's DevTools HTTP server rejects any Host header that is not an
        # IP or localhost, so the CDP endpoint (and the instance RemoteEndpoint
        # the voice relay resolver derives its host from) must be an IP, not a
        # DNS name. Pinned inside the ubag-private ipam subnet below.
        ipv4_address: ${UBAG_BROWSER_PRIVATE_IP:-172.31.0.5}
    # Health now reflects BOTH surfaces: the noVNC operator UI AND Chromium's CDP
    # endpoint (the proxy the worker attaches through). The old check probed only
    # noVNC, so a crashed/wedged Chromium stayed "healthy" and was never noticed.
    # The in-container watchdog auto-restarts Chromium; this check surfaces the
    # rare case where the browser is down to Docker/operators as well.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6080/ >/dev/null 2>&1 && wget -qO- http://127.0.0.1:9223/json/version >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s

  browser-topology-register:
    image: postgres:16-alpine
    restart: "no"
    profiles: ["live-browser"]
    depends_on:
      postgres:
        condition: service_healthy
      browser-viewer:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ubag}
      POSTGRES_USER: ${POSTGRES_USER:-ubag}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/small/env.local}
      UBAG_TOPOLOGY_TENANT_ID: ${UBAG_TOPOLOGY_TENANT_ID:-tenant_edge}
      UBAG_TOPOLOGY_INSTANCE_ID: ${UBAG_TOPOLOGY_INSTANCE_ID:-br_prod_browser_viewer}
      UBAG_TOPOLOGY_WORKER_ID: ${UBAG_TOPOLOGY_WORKER_ID:-browser-viewer}
      UBAG_BROWSER_PRIVATE_IP: ${UBAG_BROWSER_PRIVATE_IP:-172.31.0.5}
      UBAG_REMOTE_BROWSER_ENDPOINT: ${UBAG_REMOTE_BROWSER_ENDPOINT:-http://${UBAG_BROWSER_PRIVATE_IP:-172.31.0.5}:9223}
    volumes:
      - ./deploy/small/register-browser-topology.sh:/scripts/register-browser-topology.sh:ro
    entrypoint: ["/bin/sh", "/scripts/register-browser-topology.sh"]
    networks:
      - ubag-private

  browser-topology-sync:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["live-browser"]
    depends_on:
      postgres:
        condition: service_healthy
      browser-viewer:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ubag}
      POSTGRES_USER: ${POSTGRES_USER:-ubag}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/small/env.local}
      UBAG_TOPOLOGY_TENANT_ID: ${UBAG_TOPOLOGY_TENANT_ID:-tenant_edge}
      UBAG_TOPOLOGY_INSTANCE_ID: ${UBAG_TOPOLOGY_INSTANCE_ID:-br_prod_browser_viewer}
      UBAG_TOPOLOGY_WORKER_ID: ${UBAG_TOPOLOGY_WORKER_ID:-browser-viewer}
      UBAG_BROWSER_PRIVATE_IP: ${UBAG_BROWSER_PRIVATE_IP:-172.31.0.5}
      UBAG_REMOTE_BROWSER_ENDPOINT: ${UBAG_REMOTE_BROWSER_ENDPOINT:-http://${UBAG_BROWSER_PRIVATE_IP:-172.31.0.5}:9223}
      UBAG_TOPOLOGY_SYNC_INTERVAL_SECONDS: ${UBAG_TOPOLOGY_SYNC_INTERVAL_SECONDS:-60}
    volumes:
      - ./deploy/small/register-browser-topology.sh:/scripts/register-browser-topology.sh:ro
      - ./deploy/small/sync-browser-topology.sh:/scripts/sync-browser-topology.sh:ro
    entrypoint: ["/bin/sh", "/scripts/sync-browser-topology.sh"]
    networks:
      - ubag-private

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ubag}
      POSTGRES_USER: ${POSTGRES_USER:-ubag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/small/env.local}
    ports:
      - "${UBAG_BACKING_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres/0001_gateway_stores.sql:/docker-entrypoint-initdb.d/0001_gateway_stores.sql:ro
      - ./migrations/postgres/0002_artifact_metadata.sql:/docker-entrypoint-initdb.d/0002_artifact_metadata.sql:ro
      - ./migrations/postgres/0003_webhook_outbox.sql:/docker-entrypoint-initdb.d/0003_webhook_outbox.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ubag-private

  postgres-migrate:
    image: postgres:16-alpine
    restart: "no"
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ubag}
      POSTGRES_USER: ${POSTGRES_USER:-ubag}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/small/env.local}
      UBAG_ALLOW_OPTIONAL_MIGRATIONS: ${UBAG_ALLOW_OPTIONAL_MIGRATIONS:-0}
    command:
      - sh
      - -ec
      - |
        # One transaction for the whole run, guarded by the same
        # ubag-migrations advisory lock the gateway entrypoint and
        # `ubag db-migrate` take, so concurrent migration paths serialize
        # instead of interleaving DDL. ON_ERROR_STOP=1 rolls the run back on
        # the first error instead of committing a half-applied schema.
        set --
        # Every file is applied (0001-0021, including the voice + admission
        # tables 0019-0021) except 0008, which needs pgvector + pg_partman and
        # stays opt-in exactly like deploy/small/gateway-entrypoint.sh.
        for migration in /migrations/*.sql; do
          if [ "$${migration##*/}" = "0008_blueprint_schema.sql" ] && [ "$${UBAG_ALLOW_OPTIONAL_MIGRATIONS}" != "1" ]; then
            echo "Skipping optional $${migration} (set UBAG_ALLOW_OPTIONAL_MIGRATIONS=1 after installing pgvector + pg_partman)"
            continue
          fi
          echo "Staging $${migration}"
          set -- "$$@" -f "$${migration}"
        done
        psql -v ON_ERROR_STOP=1 --single-transaction -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -c "SELECT pg_advisory_xact_lock(hashtext('ubag-migrations'))" "$$@"
    volumes:
      - ./migrations/postgres:/migrations:ro
    networks:
      - ubag-private

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    mem_limit: 512m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ubag-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/small/env.local}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://127.0.0.1:9001}
    ports:
      - "${UBAG_BACKING_BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${UBAG_BACKING_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - ubag-private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ubag-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/small/env.local}
      UBAG_MINIO_ACCESS_KEY: ${UBAG_MINIO_ACCESS_KEY:?Set UBAG_MINIO_ACCESS_KEY in deploy/small/env.local}
      UBAG_MINIO_SECRET_KEY: ${UBAG_MINIO_SECRET_KEY:?Set UBAG_MINIO_SECRET_KEY in deploy/small/env.local}
      UBAG_MINIO_BUCKET: ${UBAG_MINIO_BUCKET:-ubag-artifacts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${UBAG_MINIO_BUCKET}"
        cat >/tmp/ubag-artifacts-rw.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"],
              "Resource": ["arn:aws:s3:::$${UBAG_MINIO_BUCKET}", "arn:aws:s3:::$${UBAG_MINIO_BUCKET}/*"]
            }
          ]
        }
        EOF
        if ! mc admin user info local "$${UBAG_MINIO_ACCESS_KEY}" >/dev/null 2>&1; then
          mc admin user add local "$${UBAG_MINIO_ACCESS_KEY}" "$${UBAG_MINIO_SECRET_KEY}"
        fi
        if ! mc admin policy info local ubag-artifacts-rw >/dev/null 2>&1; then
          mc admin policy create local ubag-artifacts-rw /tmp/ubag-artifacts-rw.json
        fi
        mc admin policy attach local ubag-artifacts-rw --user "$${UBAG_MINIO_ACCESS_KEY}"
    networks:
      - ubag-private

  prometheus:
    image: prom/prometheus:v3.4.2
    restart: unless-stopped
    profiles: ["observability"]
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "${UBAG_BACKING_BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/small/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ubag-private
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana-oss:12.0.2
    restart: unless-stopped
    profiles: ["observability"]
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deploy/small/env.local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${UBAG_BACKING_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/small/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - ubag-private

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    profiles: ["queue"]
    mem_limit: 256m
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${UBAG_BACKING_BIND_HOST:-127.0.0.1}:${NATS_CLIENT_PORT:-4222}:4222"
      - "${UBAG_BACKING_BIND_HOST:-127.0.0.1}:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    networks:
      - ubag-private
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  mock-worker-smoke:
    build:
      context: .
      dockerfile: deploy/small/mock-worker.Dockerfile
    image: ${UBAG_MOCK_WORKER_IMAGE:-ubag/mock-worker:small-local}
    profiles: ["smoke"]
    command: ["python", "apps/worker/run_mock_worker.py", "--input", "/fixtures/smoke-job.json"]
    volumes:
      - ./deploy/small/worker/smoke-job.json:/fixtures/smoke-job.json:ro
    networks:
      - ubag-private

  # ── Off-host backups (Task 3.4) — opt-in via COMPOSE_PROFILES=backup ────────
  # Both services upload to an OFF-HOST S3 endpoint (UBAG_BACKUP_S3_*) using the
  # mc client (SigV4). They REFUSE to run if UBAG_BACKUP_S3_ENDPOINT is unset —
  # backups must never land on this VPS (no-backups-on-host rule). Postgres
  # creds reuse the canonical POSTGRES_* vars so they can never drift from the
  # postgres service. Failures are surfaced via a heartbeat + healthcheck.

  postgres-wal-archive:
    build:
      context: .
      dockerfile: deploy/small/backup/backup.Dockerfile
    image: ${UBAG_BACKUP_IMAGE:-ubag/backup:small-local}
    profiles: [backup]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/small/env.local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-ubag}
      POSTGRES_DB: ${POSTGRES_DB:-ubag}
      BACKUP_S3_ENDPOINT: ${UBAG_BACKUP_S3_ENDPOINT:?Set UBAG_BACKUP_S3_ENDPOINT to an OFF-HOST S3 endpoint (host[:port], no scheme) — never the on-host minio}
      BACKUP_S3_ACCESS_KEY: ${UBAG_BACKUP_S3_ACCESS_KEY:?Set UBAG_BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY: ${UBAG_BACKUP_S3_SECRET_KEY:?Set UBAG_BACKUP_S3_SECRET_KEY}
      BACKUP_S3_BUCKET: ${UBAG_BACKUP_S3_BUCKET:-ubag-backups}
      BACKUP_S3_PREFIX: ${UBAG_BACKUP_S3_PREFIX:-ubag-small}
      BACKUP_S3_USE_SSL: ${UBAG_BACKUP_S3_USE_SSL:-true}
      BACKUP_RETENTION_DAYS: ${UBAG_BACKUP_RETENTION_DAYS:-30}
      BACKUP_HEARTBEAT_FILE: /var/lib/backup/last-success-base
    volumes:
      - ./deploy/small/backup/wal-archive.sh:/scripts/wal-archive.sh:ro
      - backup_state:/var/lib/backup
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "while true; do /scripts/wal-archive.sh || echo '[wal-archive] ERROR: base-backup cycle failed (healthcheck will flip unhealthy)'; sleep ${UBAG_BACKUP_BASE_INTERVAL_SECONDS:-86400}; done"
    # Base backup runs daily; flag unhealthy only if a run is >26h late (a genuine
    # miss), giving the daily cadence a couple of hours of grace.
    healthcheck:
      test: ["CMD-SHELL", "now=$$(date +%s); last=$$(cat /var/lib/backup/last-success-base 2>/dev/null || echo 0); [ $$((now - last)) -lt ${UBAG_BACKUP_BASE_STALE_SECONDS:-93600} ]"]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 3600s
    networks:
      - ubag-private
    restart: unless-stopped

  backup-cron:
    build:
      context: .
      dockerfile: deploy/small/backup/backup.Dockerfile
    image: ${UBAG_BACKUP_IMAGE:-ubag/backup:small-local}
    profiles: [backup]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/small/env.local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-ubag}
      POSTGRES_DB: ${POSTGRES_DB:-ubag}
      BACKUP_S3_ENDPOINT: ${UBAG_BACKUP_S3_ENDPOINT:?Set UBAG_BACKUP_S3_ENDPOINT to an OFF-HOST S3 endpoint (host[:port], no scheme) — never the on-host minio}
      BACKUP_S3_ACCESS_KEY: ${UBAG_BACKUP_S3_ACCESS_KEY:?Set UBAG_BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY: ${UBAG_BACKUP_S3_SECRET_KEY:?Set UBAG_BACKUP_S3_SECRET_KEY}
      BACKUP_S3_BUCKET: ${UBAG_BACKUP_S3_BUCKET:-ubag-backups}
      BACKUP_S3_PREFIX: ${UBAG_BACKUP_S3_PREFIX:-ubag-small}
      BACKUP_S3_USE_SSL: ${UBAG_BACKUP_S3_USE_SSL:-true}
      BACKUP_RETENTION_DAYS: ${UBAG_BACKUP_RETENTION_DAYS:-30}
      BACKUP_HEARTBEAT_FILE: /var/lib/backup/last-success-dump
    volumes:
      - ./deploy/small/backup/backup-cron.sh:/scripts/backup-cron.sh:ro
      - backup_state:/var/lib/backup
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "while true; do /scripts/backup-cron.sh || echo '[backup] ERROR: dump cycle failed (healthcheck will flip unhealthy)'; sleep ${UBAG_BACKUP_FULL_INTERVAL_SECONDS:-3600}; done"
    healthcheck:
      test: ["CMD-SHELL", "now=$$(date +%s); last=$$(cat /var/lib/backup/last-success-dump 2>/dev/null || echo 0); [ $$((now - last)) -lt ${UBAG_BACKUP_DUMP_STALE_SECONDS:-7200} ]"]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 3600s
    networks:
      - ubag-private
    restart: unless-stopped

networks:
  ubag-public:
  ubag-private:
    internal: true
    # Explicit subnet so browser-viewer can hold a static IP (see its
    # ipv4_address). ip_range keeps Docker's dynamic allocation in the upper half
    # so it can never hand the pinned address to another container. Pick any free
    # range on your host (docker network ls / inspect) and keep all three
    # UBAG_PRIVATE_SUBNET / UBAG_PRIVATE_IP_RANGE / UBAG_BROWSER_PRIVATE_IP
    # consistent.
    ipam:
      config:
        - subnet: ${UBAG_PRIVATE_SUBNET:-172.31.0.0/24}
          ip_range: ${UBAG_PRIVATE_IP_RANGE:-172.31.0.128/25}

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  nats_data:
  executor_spool:
  browser_profiles:
  # Persists backup heartbeat files (last-success-*) that the backup/wal-archive
  # healthchecks read to detect stalled backups across container restarts.
  backup_state:
